  </g>
  <g id="text_28">
   <text style="fill: #263b43; font: 11px 'DejaVu Sans'; text-anchor: start" x="51.84" y="535.68" transform="rotate(-0 51.84 535.68)">Exact calculation of h⁽¹⁾ = S h⁽⁰⁾ and h⁽²⁾ = S² h⁽⁰⁾; not a trained model or biological measurement.</text>
  </g>

  <g id="text_25">
   <text style="fill: #263b43; font: 12px 'DejaVu Sans'; text-anchor: start" x="43.2" y="66.24" transform="rotate(-0 43.2 66.24)">Constructed example: three-node path, self-loops, identity feature transform, no nonlinearity.</text>
  </g>
  <g id="text_26">

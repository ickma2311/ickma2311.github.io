   <g id="text_5">
    <text style="fill: #263b3c; font: 14px 'DejaVu Sans'" transform="translate(260.926406 155.616325)">Decoder → profile</text>
    <!-- $\rho=\mathrm{softmax}(f(z,s))$ -->
    <g style="fill: #263b3c" transform="translate(257.0775 173.423887)">
     <text>
      <tspan style="font: oblique 14px 'DejaVu Sans'" x="0 88.313477 98.704102 113.230469" y="-0.359375">ρfzs</tspan>
      <tspan style="font: 14px 'DejaVu Sans'" x="11.614258 26.072266 33.366211 41.931641 46.860352 52.349609 65.987305 74.566406 82.851562 93.242188 106.052734 120.524414 125.986328" y="-0.359375">=softmax((,))</tspan>
     </text>
    </g>
    <!-- $\sum_g\rho_g=1$ -->
    <g style="fill: #263b3c" transform="translate(295.6475 196.355887)">
     <text>
      <tspan style="font: 14px 'DejaVu Sans Display'" x="0" y="-0.765625">∑</tspan>
      <tspan style="font: oblique 9.8px 'DejaVu Sans'" x="4 21.589844" y="11.146875000000001 1.53125">gg</tspan>
      <tspan style="font: oblique 14px 'DejaVu Sans'" x="12.703125" y="-0.7656249999999982">ρ</tspan>
      <tspan style="font: 14px 'DejaVu Sans'" x="30.920898 45.378906" y="-0.7656249999999982">=1</tspan>
     </text>
    </g>
   </g>

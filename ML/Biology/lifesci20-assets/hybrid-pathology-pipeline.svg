<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font-family: Georgia, "Times New Roman", serif; font-size: 30px; font-weight: 700; fill: #262420; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-size: 16.5px; fill: #5C5852; }
      .panel-title { font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 700; fill: #262420; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #262420; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-size: 14.8px; fill: #262420; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-size: 13.5px; fill: #5C5852; }
      .math { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; fill: #262420; }
      .num { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-size: 18px; font-weight: 700; }
      .footer { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-size: 13px; fill: #5C5852; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FAF6EE"/>
  <text x="56" y="56" class="title">End-to-End Fragility vs. Hybrid Pathology Features</text>
  <text x="56" y="86" class="subtitle">MIT 6.874 Lecture 20 (Part A · Anant Madabhushi): separating object segmentation from explicit geometric risk modeling</text>
  <line x1="56" y1="104" x2="1544" y2="104" stroke="#D6CEC0" stroke-width="1.5"/>
  
    <!-- Left Panel -->
    <rect x="56" y="124" width="690" height="700" rx="10" fill="#FFFDF9" stroke="#D6CEC0" stroke-width="1.5"/>
    <text x="84" y="164" class="panel-title">A. End-to-End CNN Vulnerability to Acquisition Shift</text>
    <text x="84" y="190" class="small">Reported Penn endomyocardial biopsy AUCs: pixel convolutions absorb scanner traits</text>
    <line x1="126" y1="510.0" x2="690" y2="510.0" stroke="#D6CEC0" stroke-dasharray="4,4" stroke-width="1"/><text x="116" y="515.0" text-anchor="end" class="small">0.50</text><line x1="126" y1="460.0" x2="690" y2="460.0" stroke="#D6CEC0" stroke-dasharray="4,4" stroke-width="1"/><text x="116" y="465.0" text-anchor="end" class="small">0.60</text><line x1="126" y1="410.0" x2="690" y2="410.0" stroke="#D6CEC0" stroke-dasharray="4,4" stroke-width="1"/><text x="116" y="415.0" text-anchor="end" class="small">0.70</text><line x1="126" y1="360.0" x2="690" y2="360.0" stroke="#D6CEC0" stroke-dasharray="4,4" stroke-width="1"/><text x="116" y="365.0" text-anchor="end" class="small">0.80</text><line x1="126" y1="310.0" x2="690" y2="310.0" stroke="#D6CEC0" stroke-dasharray="4,4" stroke-width="1"/><text x="116" y="315.0" text-anchor="end" class="small">0.90</text><line x1="126" y1="260.0" x2="690" y2="260.0" stroke="#D6CEC0" stroke-dasharray="4,4" stroke-width="1"/><text x="116" y="265.0" text-anchor="end" class="small">1.00</text><line x1="126" y1="250" x2="126" y2="510" stroke="#262420" stroke-width="1.5"/><line x1="126" y1="510" x2="690" y2="510" stroke="#262420" stroke-width="1.5"/><text x="74" y="385" transform="rotate(-90 74 385)" text-anchor="middle" class="small">Reported AUC (Penn Heart Failure Biopsies)</text><rect x="164" y="390.0" width="92" height="120.0" rx="4" fill="#5C5852" fill-opacity="0.88"/><text x="210" y="380.0" text-anchor="middle" class="num" fill="#5C5852">0.74</text><text x="210" y="534" text-anchor="middle" class="small" fill="#262420">Pathologists</text><text x="210" y="552" text-anchor="middle" class="small" fill="#262420">(Cohort 1, n = 105)</text><rect x="349" y="275.0" width="92" height="235.0" rx="4" fill="#356482" fill-opacity="0.88"/><text x="395" y="265.0" text-anchor="middle" class="num" fill="#356482">0.97</text><text x="395" y="534" text-anchor="middle" class="small" fill="#262420">End-to-End CNN</text><text x="395" y="552" text-anchor="middle" class="small" fill="#262420">(Cohort 1, n = 105)</text><rect x="534" y="385.0" width="92" height="125.0" rx="4" fill="#B5493A" fill-opacity="0.88"/><text x="580" y="375.0" text-anchor="middle" class="num" fill="#B5493A">0.75</text><text x="580" y="534" text-anchor="middle" class="small" fill="#262420">Same CNN</text><text x="580" y="552" text-anchor="middle" class="small" fill="#262420">(Cohort 2)</text><rect x="494" y="246" width="184" height="46" rx="6" fill="#F8E8E5" stroke="#B5493A" stroke-width="1.1"/><text x="586" y="266" text-anchor="middle" class="small" fill="#B5493A" font-weight="700">−0.22 CNN drop</text><text x="586" y="283" text-anchor="middle" class="small" fill="#B5493A">same site &amp; scanner</text><path d="M 447 294 C 482 308, 510 342, 531 372" fill="none" stroke="#B5493A" stroke-width="2.4"/><polygon points="536.0,379.0 525.6,372.8 533.8,367.1" fill="#B5493A"/>
    <rect x="88" y="588" width="626" height="212" rx="8" fill="#F3ECE0" stroke="#D6CEC0" stroke-width="1"/>
    <text x="110" y="616" class="label">Why end-to-end pathology classifiers fail silently</text>
    <text x="110" y="644" class="body">• Cohort 1 (104 train, 105 test): CNN AUC 0.97 ± 0.01 vs. pathologists 0.74 (0.75, 0.73).</text>
    <text x="110" y="672" class="body">• Cohort 2: CNN AUC fell by 0.22 (0.97 → 0.75) on biopsies from the same site and</text>
    <text x="124" y="694" class="body">scanner; the lecturer attributed the drop to a remote scanner software upgrade.</text>
    <text x="110" y="722" class="body">• No Cohort 2 pathologist AUC or paired hybrid Penn AUC is shown in this figure</text>
    <text x="124" y="744" class="body">(Part A recording, 21:09–26:52; Nirschl et al., PLOS ONE 2018).</text>
    <text x="110" y="778" class="body" fill="#356482" font-weight="600">Takeaway: strong single-cohort AUC does not guarantee scanner invariance.</text>

    <!-- Right Panel -->
    <rect x="774" y="124" width="770" height="700" rx="10" fill="#FFFDF9" stroke="#D6CEC0" stroke-width="1.5"/>
    <text x="802" y="164" class="panel-title">B. Hybrid Pipeline: Segment Primitives, Engineer Features</text>
    <text x="802" y="190" class="small">Deep learning locates biological objects; explicit geometry drives risk scoring</text>

    <!-- 3-step pipeline boxes with explicit polygon arrowheads -->
    <rect x="802" y="218" width="210" height="106" rx="8" fill="#E6EFF5" stroke="#356482" stroke-width="1.5"/>
    <text x="907" y="248" text-anchor="middle" class="label" fill="#356482">1. Deep Segmentation</text>
    <text x="907" y="274" text-anchor="middle" class="small" fill="#262420">Detect nuclei, TILs,</text>
    <text x="907" y="294" text-anchor="middle" class="small" fill="#262420">glands &amp; collagen fibers</text>
    <text x="907" y="314" text-anchor="middle" class="small">(+ Quick Annotator)</text>

    <line x1="1012.0" y1="271.0" x2="1046.5" y2="271.0" stroke="#262420" stroke-width="2.0"/><polygon points="1054.0,271.0 1044.0,276.0 1044.0,266.0" fill="#262420"/>

    <rect x="1056" y="218" width="222" height="106" rx="8" fill="#F7EFE0" stroke="#A87919" stroke-width="1.5"/>
    <text x="1167" y="248" text-anchor="middle" class="label" fill="#A87919">2. Explicit Features</text>
    <text x="1167" y="274" text-anchor="middle" class="small" fill="#262420">Voronoi / Delaunay graphs,</text>
    <text x="1167" y="294" text-anchor="middle" class="small" fill="#262420">gland lumen geometry,</text>
    <text x="1167" y="314" text-anchor="middle" class="small" fill="#262420">orientation entropy H(p)</text>

    <line x1="1278.0" y1="271.0" x2="1312.5" y2="271.0" stroke="#262420" stroke-width="2.0"/><polygon points="1320.0,271.0 1310.0,276.0 1310.0,266.0" fill="#262420"/>

    <rect x="1322" y="218" width="194" height="106" rx="8" fill="#E8F0E6" stroke="#4B6B46" stroke-width="1.5"/>
    <text x="1419" y="248" text-anchor="middle" class="label" fill="#4B6B46">3. Clinical Risk Score</text>
    <text x="1419" y="274" text-anchor="middle" class="small" fill="#262420">Prognostic &amp; predictive</text>
    <text x="1419" y="294" text-anchor="middle" class="small" fill="#262420">risk models (IbRiS)</text>
    <text x="1419" y="314" text-anchor="middle" class="small">non-destructive H&amp;E</text>

    <!-- Worked Example Box: Collagen Fiber Orientation Disorder -->
    <rect x="802" y="352" width="714" height="448" rx="8" fill="#F3ECE0" stroke="#D6CEC0" stroke-width="1"/>
    <text x="826" y="384" class="label">Constructed Check: Local-Window Entropy (CFOD-TS Schematic)</text>
    <text x="826" y="410" class="small">Undirected axial angle θ ∈ [0°, 180°) in K = 4 bins: H(p) = −Σ p<tspan baseline-shift="sub" font-size="10.5">k</tspan> log<tspan baseline-shift="sub" font-size="10.5">2</tspan>(p<tspan baseline-shift="sub" font-size="10.5">k</tspan>) (bits)</text>

    <!-- Left mini-card: Aligned -->
    <rect x="826" y="432" width="320" height="250" rx="8" fill="#FFFDF9" stroke="#B5493A" stroke-width="1.3"/>
    <text x="986" y="460" text-anchor="middle" class="label" fill="#B5493A">Aligned Fibers (Low Disorder)</text>
    <text x="986" y="482" text-anchor="middle" class="small">p = (1, 0, 0, 0)  →  H = 0.00 bits</text>
    <rect x="846" y="498" width="280" height="148" rx="6" fill="#F8E8E5" fill-opacity="0.45"/>
    <line x1="875" y1="542" x2="909" y2="538" stroke="#B5493A" stroke-width="2.6" stroke-linecap="round"/><line x1="927" y1="542" x2="961" y2="538" stroke="#B5493A" stroke-width="2.6" stroke-linecap="round"/><line x1="979" y1="542" x2="1013" y2="538" stroke="#B5493A" stroke-width="2.6" stroke-linecap="round"/><line x1="1031" y1="542" x2="1065" y2="538" stroke="#B5493A" stroke-width="2.6" stroke-linecap="round"/><line x1="1083" y1="542" x2="1117" y2="538" stroke="#B5493A" stroke-width="2.6" stroke-linecap="round"/><line x1="875" y1="566" x2="909" y2="562" stroke="#B5493A" stroke-width="2.6" stroke-linecap="round"/><line x1="927" y1="566" x2="961" y2="562" stroke="#B5493A" stroke-width="2.6" stroke-linecap="round"/><line x1="979" y1="566" x2="1013" y2="562" stroke="#B5493A" stroke-width="2.6" stroke-linecap="round"/><line x1="1031" y1="566" x2="1065" y2="562" stroke="#B5493A" stroke-width="2.6" stroke-linecap="round"/><line x1="1083" y1="566" x2="1117" y2="562" stroke="#B5493A" stroke-width="2.6" stroke-linecap="round"/><line x1="875" y1="590" x2="909" y2="586" stroke="#B5493A" stroke-width="2.6" stroke-linecap="round"/><line x1="927" y1="590" x2="961" y2="586" stroke="#B5493A" stroke-width="2.6" stroke-linecap="round"/><line x1="979" y1="590" x2="1013" y2="586" stroke="#B5493A" stroke-width="2.6" stroke-linecap="round"/><line x1="1031" y1="590" x2="1065" y2="586" stroke="#B5493A" stroke-width="2.6" stroke-linecap="round"/><line x1="1083" y1="590" x2="1117" y2="586" stroke="#B5493A" stroke-width="2.6" stroke-linecap="round"/><line x1="875" y1="614" x2="909" y2="610" stroke="#B5493A" stroke-width="2.6" stroke-linecap="round"/><line x1="927" y1="614" x2="961" y2="610" stroke="#B5493A" stroke-width="2.6" stroke-linecap="round"/><line x1="979" y1="614" x2="1013" y2="610" stroke="#B5493A" stroke-width="2.6" stroke-linecap="round"/><line x1="1031" y1="614" x2="1065" y2="610" stroke="#B5493A" stroke-width="2.6" stroke-linecap="round"/><line x1="1083" y1="614" x2="1117" y2="610" stroke="#B5493A" stroke-width="2.6" stroke-linecap="round"/>
    <text x="986" y="668" text-anchor="middle" class="small" fill="#5C5852" font-weight="600">Toy check: 20/20 fibers in one 45° bin</text>

    <!-- Right mini-card: Disordered -->
    <rect x="1174" y="432" width="320" height="250" rx="8" fill="#FFFDF9" stroke="#4B6B46" stroke-width="1.3"/>
    <text x="1334" y="460" text-anchor="middle" class="label" fill="#4B6B46">Disordered Fibers (High Disorder)</text>
    <text x="1334" y="482" text-anchor="middle" class="small">p = (0.25, 0.25, 0.25, 0.25)  →  H = 2.00 bits</text>
    <rect x="1194" y="498" width="280" height="148" rx="6" fill="#E8F0E6" fill-opacity="0.45"/>
    <line x1="1212.5" y1="535.9" x2="1243.5" y2="544.1" stroke="#4B6B46" stroke-width="2.6" stroke-linecap="round"/><line x1="1275.1" y1="524.8" x2="1284.9" y2="555.2" stroke="#4B6B46" stroke-width="2.6" stroke-linecap="round"/><line x1="1342.3" y1="527.7" x2="1321.7" y2="552.3" stroke="#4B6B46" stroke-width="2.6" stroke-linecap="round"/><line x1="1399.7" y1="536.7" x2="1368.3" y2="543.3" stroke="#4B6B46" stroke-width="2.6" stroke-linecap="round"/><line x1="1424.7" y1="528.7" x2="1447.3" y2="551.3" stroke="#4B6B46" stroke-width="2.6" stroke-linecap="round"/><line x1="1233.5" y1="549.0" x2="1222.5" y2="579.0" stroke="#4B6B46" stroke-width="2.6" stroke-linecap="round"/><line x1="1264.1" y1="562.6" x2="1295.9" y2="565.4" stroke="#4B6B46" stroke-width="2.6" stroke-linecap="round"/><line x1="1331.4" y1="548.0" x2="1332.6" y2="580.0" stroke="#4B6B46" stroke-width="2.6" stroke-linecap="round"/><line x1="1398.1" y1="556.5" x2="1369.9" y2="571.5" stroke="#4B6B46" stroke-width="2.6" stroke-linecap="round"/><line x1="1422.6" y1="555.3" x2="1449.4" y2="572.7" stroke="#4B6B46" stroke-width="2.6" stroke-linecap="round"/><line x1="1237.2" y1="574.9" x2="1218.8" y2="601.1" stroke="#4B6B46" stroke-width="2.6" stroke-linecap="round"/><line x1="1272.0" y1="574.1" x2="1288.0" y2="601.9" stroke="#4B6B46" stroke-width="2.6" stroke-linecap="round"/><line x1="1347.9" y1="586.6" x2="1316.1" y2="589.4" stroke="#4B6B46" stroke-width="2.6" stroke-linecap="round"/><line x1="1369.2" y1="582.0" x2="1398.8" y2="594.0" stroke="#4B6B46" stroke-width="2.6" stroke-linecap="round"/><line x1="1437.4" y1="572.1" x2="1434.6" y2="603.9" stroke="#4B6B46" stroke-width="2.6" stroke-linecap="round"/><line x1="1240.6" y1="602.1" x2="1215.4" y2="621.9" stroke="#4B6B46" stroke-width="2.6" stroke-linecap="round"/><line x1="1294.8" y1="606.0" x2="1265.2" y2="618.0" stroke="#4B6B46" stroke-width="2.6" stroke-linecap="round"/><line x1="1329.2" y1="596.2" x2="1334.8" y2="627.8" stroke="#4B6B46" stroke-width="2.6" stroke-linecap="round"/><line x1="1391.5" y1="597.9" x2="1376.5" y2="626.1" stroke="#4B6B46" stroke-width="2.6" stroke-linecap="round"/><line x1="1420.2" y1="609.2" x2="1451.8" y2="614.8" stroke="#4B6B46" stroke-width="2.6" stroke-linecap="round"/>
    <text x="1334" y="668" text-anchor="middle" class="small" fill="#5C5852" font-weight="600">Toy check: 5 fibers per 45° bin [5,5,5,5]</text>

    <text x="826" y="716" class="body">Reported ER+ cohorts (E2197, n = 234, p = 0.0057; TCGA, n = 171, p = 0.0090; Part A pp. 19–20):</text>
    <text x="826" y="742" class="body">higher CFOD-TS was independently linked to longer disease-free survival (aligned fibers may act</text>
    <text x="826" y="768" class="body">as tumor-cell migration tracks, whereas disordered stromal collagen impedes invasion).</text>
    
  <line x1="56" y1="846" x2="1544" y2="846" stroke="#D6CEC0" stroke-width="1"/>
  <text x="56" y="872" class="footer">Panel A: reported Penn endomyocardial biopsy AUCs (21:09–26:52; Nirschl et al., 2018). Panel B: hybrid pipeline, constructed 4-bin axial schematic, and reported ER+ DFS.</text>
</svg>

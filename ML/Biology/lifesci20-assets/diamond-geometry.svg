<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font-family: Georgia, "Times New Roman", serif; font-size: 30px; font-weight: 700; fill: #262420; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-size: 16.5px; fill: #5C5852; }
      .panel-title { font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 700; fill: #262420; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #262420; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-size: 14.8px; fill: #262420; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-size: 13.5px; fill: #5C5852; }
      .math { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; fill: #262420; }
      .num { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-size: 18px; font-weight: 700; }
      .footer { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-size: 13px; fill: #5C5852; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FAF6EE"/>
  <text x="56" y="56" class="title">DiaMOND: Measuring High-Order Drug Combinations Without Full Checkerboards</text>
  <text x="56" y="86" class="subtitle">MIT 6.874 Lecture 20 (Part B · Bree Aldridge): geometric reduction of N-way dose space and in vitro potency predictors</text>
  <line x1="56" y1="104" x2="1544" y2="104" stroke="#D6CEC0" stroke-width="1.5"/>
  
    <!-- Left Panel: 2D DiaMOND Geometry -->
    <rect x="56" y="124" width="670" height="700" rx="10" fill="#FFFDF9" stroke="#D6CEC0" stroke-width="1.5"/>
    <text x="84" y="164" class="panel-title">A. DiaMOND Equipotent Geometry (Constructed Check)</text>
    <text x="84" y="190" class="small">Normalized IC<tspan baseline-shift="sub" font-size="10">90</tspan> space: FIC = r<tspan baseline-shift="sub" font-size="10">obs</tspan> / r<tspan baseline-shift="sub" font-size="10">exp</tspan> along 1:1 mixture ray (r<tspan baseline-shift="sub" font-size="10">exp</tspan> = 1/√2 ≈ 0.707)</text>

    <line x1="220.0" y1="660" x2="220.0" y2="288" stroke="#D6CEC0" stroke-dasharray="3,4" stroke-width="1"/><line x1="140" y1="580.0" x2="512" y2="580.0" stroke="#D6CEC0" stroke-dasharray="3,4" stroke-width="1"/><text x="220.0" y="682" text-anchor="middle" class="small">0.25</text><text x="128" y="585.0" text-anchor="end" class="small">0.25</text><line x1="300.0" y1="660" x2="300.0" y2="288" stroke="#D6CEC0" stroke-dasharray="3,4" stroke-width="1"/><line x1="140" y1="500.0" x2="512" y2="500.0" stroke="#D6CEC0" stroke-dasharray="3,4" stroke-width="1"/><text x="300.0" y="682" text-anchor="middle" class="small">0.50</text><text x="128" y="505.0" text-anchor="end" class="small">0.50</text><line x1="380.0" y1="660" x2="380.0" y2="288" stroke="#D6CEC0" stroke-dasharray="3,4" stroke-width="1"/><line x1="140" y1="420.0" x2="512" y2="420.0" stroke="#D6CEC0" stroke-dasharray="3,4" stroke-width="1"/><text x="380.0" y="682" text-anchor="middle" class="small">0.75</text><text x="128" y="425.0" text-anchor="end" class="small">0.75</text><line x1="460.0" y1="660" x2="460.0" y2="288" stroke="#D6CEC0" stroke-dasharray="3,4" stroke-width="1"/><line x1="140" y1="340.0" x2="512" y2="340.0" stroke="#D6CEC0" stroke-dasharray="3,4" stroke-width="1"/><text x="460.0" y="682" text-anchor="middle" class="small">1.00</text><text x="128" y="345.0" text-anchor="end" class="small">1.00</text>
    <!-- Axes with explicit polygon arrowheads -->
    <line x1="140.0" y1="660.0" x2="524.5" y2="660.0" stroke="#262420" stroke-width="2.0"/><polygon points="532.0,660.0 522.0,665.0 522.0,655.0" fill="#262420"/>
    <line x1="140.0" y1="660.0" x2="140.0" y2="275.5" stroke="#262420" stroke-width="2.0"/><polygon points="140.0,268.0 145.0,278.0 135.0,278.0" fill="#262420"/>
    <text x="325" y="712" text-anchor="middle" class="label">Drug X Dose (normalized to IC<tspan baseline-shift="sub" font-size="11">90,X</tspan> = 1.0)</text>
    <text x="84" y="475" transform="rotate(-90 84 475)" text-anchor="middle" class="label">Drug Y Dose (normalized to IC<tspan baseline-shift="sub" font-size="11">90,Y</tspan> = 1.0)</text>

    <!-- Diagonal ray -->
    <line x1="140" y1="660" x2="498.4" y2="301.6" stroke="#356482" stroke-width="2.2" stroke-dasharray="7,4"/>
    <text x="492.4" y="289.6" text-anchor="end" class="small" fill="#356482" font-weight="700">1:1 mixture ray</text>

    <!-- Additivity line -->
    <line x1="140.0" y1="340.0" x2="460.0" y2="660.0" stroke="#262420" stroke-width="2.2"/>
    <!-- Synergy & Antagonism contours passing EXACTLY through (0.25,0.25) and (0.75,0.75) -->
    <path d="M 140.0 340.0 Q 140.0 660.0 460.0 660.0" fill="none" stroke="#4B6B46" stroke-width="2.6"/>
    <path d="M 140.0 340.0 Q 460.0 340.0 460.0 660.0" fill="none" stroke="#B5493A" stroke-width="2.6"/>

    <!-- Single-drug IC90 intercepts -->
    <circle cx="460.0" cy="660.0" r="6.2" fill="#FFFDF9" stroke="#262420" stroke-width="2.2"/>
    <circle cx="140.0" cy="340.0" r="6.2" fill="#FFFDF9" stroke="#262420" stroke-width="2.2"/>

    <!-- Diagonal intersection points -->
    <circle cx="220.0" cy="580.0" r="6.8" fill="#4B6B46"/>
    <circle cx="300.0" cy="500.0" r="6.8" fill="#262420"/>
    <circle cx="380.0" cy="420.0" r="6.8" fill="#B5493A"/>

    <!-- Non-overlapping right-column worked-example cards with matching marker dots -->
    <rect x="486" y="380" width="218" height="58" rx="7" fill="#F8E8E5" stroke="#B5493A" stroke-width="1.2"/>
    <circle cx="503" cy="400" r="5.5" fill="#B5493A"/>
    <text x="516" y="405" class="small" fill="#B5493A" font-weight="700">Antagonism: (0.75, 0.75)</text>
    <text x="503" y="426" class="small" fill="#B5493A">FIC = 1.50 &gt; 1 (above line)</text>

    <rect x="486" y="462" width="218" height="58" rx="7" fill="#F3ECE0" stroke="#262420" stroke-width="1.2"/>
    <circle cx="503" cy="482" r="5.5" fill="#262420"/>
    <text x="516" y="487" class="small" fill="#262420" font-weight="700">Additive: (0.50, 0.50)</text>
    <text x="503" y="508" class="small" fill="#262420">FIC = 1.00 (on additivity line)</text>

    <rect x="486" y="544" width="218" height="58" rx="7" fill="#E8F0E6" stroke="#4B6B46" stroke-width="1.2"/>
    <circle cx="503" cy="564" r="5.5" fill="#4B6B46"/>
    <text x="516" y="569" class="small" fill="#4B6B46" font-weight="700">Synergy: (0.25, 0.25)</text>
    <text x="503" y="590" class="small" fill="#4B6B46">FIC = 0.50 &lt; 1 (below line)</text>

    <text x="84" y="756" class="small">Note: one equipotent ray tests FIC at equal normalized fractions; off-ray asymmetric</text>
    <text x="84" y="776" class="small">ratios require extra rays. In N dimensions, the additivity line becomes a hyperplane.</text>

    <!-- Right Panel: Scaling & In-Vivo Finding -->
    <rect x="752" y="124" width="792" height="700" rx="10" fill="#FFFDF9" stroke="#D6CEC0" stroke-width="1.5"/>
    <text x="780" y="164" class="panel-title">B. Checkerboard Scaling &amp; BALB/c Mouse Findings</text>
    <text x="780" y="190" class="small">Lecture checkerboard example (384-well plates / replicate) vs. DiaMOND 175-regimen TB screen</text>

    <line x1="820" y1="480" x2="1280" y2="480" stroke="#262420" stroke-width="1.5"/><line x1="820" y1="235" x2="820" y2="480" stroke="#262420" stroke-width="1.5"/><line x1="820" y1="480.0" x2="1280" y2="480.0" stroke="#D6CEC0" stroke-dasharray="3,4" stroke-width="1"/><text x="810" y="485.0" text-anchor="end" class="small">0</text><line x1="820" y1="435.0" x2="1280" y2="435.0" stroke="#D6CEC0" stroke-dasharray="3,4" stroke-width="1"/><text x="810" y="440.0" text-anchor="end" class="small">5</text><line x1="820" y1="390.0" x2="1280" y2="390.0" stroke="#D6CEC0" stroke-dasharray="3,4" stroke-width="1"/><text x="810" y="395.0" text-anchor="end" class="small">10</text><line x1="820" y1="345.0" x2="1280" y2="345.0" stroke="#D6CEC0" stroke-dasharray="3,4" stroke-width="1"/><text x="810" y="350.0" text-anchor="end" class="small">15</text><line x1="820" y1="300.0" x2="1280" y2="300.0" stroke="#D6CEC0" stroke-dasharray="3,4" stroke-width="1"/><text x="810" y="305.0" text-anchor="end" class="small">20</text><line x1="820" y1="255.0" x2="1280" y2="255.0" stroke="#D6CEC0" stroke-dasharray="3,4" stroke-width="1"/><text x="810" y="260.0" text-anchor="end" class="small">25</text><text x="782" y="362" transform="rotate(-90 782 362)" text-anchor="middle" class="small">384-well plates / replicate</text><rect x="842" y="471.0" width="80" height="9.0" rx="3" fill="#356482" fill-opacity="0.88"/><text x="882" y="462.0" text-anchor="middle" class="num" fill="#356482">1</text><text x="882" y="502" text-anchor="middle" class="small" fill="#262420">2-way</text><text x="882" y="520" text-anchor="middle" class="small" fill="#262420">(1 plate)</text><rect x="994" y="453.0" width="80" height="27.0" rx="3" fill="#A87919" fill-opacity="0.88"/><text x="1034" y="444.0" text-anchor="middle" class="num" fill="#A87919">3</text><text x="1034" y="502" text-anchor="middle" class="small" fill="#262420">3-way</text><text x="1034" y="520" text-anchor="middle" class="small" fill="#262420">(3 plates)</text><rect x="1146" y="255.0" width="80" height="225.0" rx="3" fill="#B5493A" fill-opacity="0.88"/><text x="1186" y="246.0" text-anchor="middle" class="num" fill="#B5493A">25</text><text x="1186" y="502" text-anchor="middle" class="small" fill="#262420">4-way</text><text x="1186" y="520" text-anchor="middle" class="small" fill="#262420">(25 plates)</text><rect x="1302" y="256" width="214" height="224" rx="8" fill="#E8F0E6" stroke="#4B6B46" stroke-width="1.5"/><text x="1409" y="292" text-anchor="middle" class="label" fill="#4B6B46">DiaMOND Design</text><text x="1409" y="320" text-anchor="middle" class="small" fill="#262420">Instead of full N-D grids,</text><text x="1409" y="340" text-anchor="middle" class="small" fill="#262420">measure only:</text><text x="1409" y="370" text-anchor="middle" class="small" fill="#4B6B46" font-weight="700">• N single-drug axes</text><text x="1409" y="392" text-anchor="middle" class="small" fill="#4B6B46" font-weight="700">• 1 equal-fraction ray</text><text x="1409" y="426" text-anchor="middle" class="small" fill="#5C5852">Preserves dose-response</text><text x="1409" y="446" text-anchor="middle" class="small" fill="#5C5852">curves for both potency</text><text x="1409" y="466" text-anchor="middle" class="small" fill="#5C5852">&amp; FIC scoring</text>

    <!-- Findings Box -->
    <rect x="780" y="556" width="736" height="244" rx="8" fill="#F3ECE0" stroke="#D6CEC0" stroke-width="1.2"/>
    <text x="804" y="586" class="label">Reported Empirical Findings (Part B pp. 28–36; Larkins-Ford et al., 2021)</text>
    <text x="804" y="616" class="body">• Combinatorial space: 20 TB drugs yield C(20, 3) = 1,140 three-drug regimens.</text>
    <text x="804" y="644" class="body">• DiaMOND tested 10 drugs: 175 regimens (10 single + 165 multidrug: 45 pairs, 120 triples)</text>
    <text x="818" y="666" class="body">across 8 growth environments (&gt;50,000 dynamic dose-response curves).</text>
    <text x="804" y="696" class="body" fill="#B5493A" font-weight="600">• No single combination was synergistic across all 8 growth environments.</text>
    <text x="804" y="726" class="body" fill="#4B6B46" font-weight="600">• On 27 train / 19 test regimens in BALB/c mice (C1 better than SOC vs. C0 SOC or worse),</text>
    <text x="818" y="748" class="body" fill="#4B6B46" font-weight="600">potency (E<tspan baseline-shift="sub" font-size="10.5">inf</tspan>, GR<tspan baseline-shift="sub" font-size="10.5">inf</tspan>, AUC<tspan baseline-shift="sub" font-size="10.5">25</tspan>) in lipid-rich &amp; acidic media drove PCA + RF separation.</text>
    <text x="804" y="778" class="small">Top small-condition Random Forest models reached test AUC 0.75–0.94 (Part B p. 36).</text>
    
  <line x1="56" y1="846" x2="1544" y2="846" stroke="#D6CEC0" stroke-width="1"/>
  <text x="56" y="872" class="footer">Panel A: constructed IC<tspan baseline-shift="sub" font-size="9.5">90</tspan>-normalized worked check (r<tspan baseline-shift="sub" font-size="9.5">exp</tspan> = 0.707; r<tspan baseline-shift="sub" font-size="9.5">obs</tspan> = 0.354, 1.061). Panel B: reported plate example &amp; BALB/c results (Part B pp. 25–36; Cokol et al. 2017; Larkins-Ford et al. 2021).</text>
</svg>

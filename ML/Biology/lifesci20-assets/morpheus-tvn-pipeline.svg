<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font-family: Georgia, "Times New Roman", serif; font-size: 30px; font-weight: 700; fill: #262420; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-size: 16.5px; fill: #5C5852; }
      .panel-title { font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 700; fill: #262420; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #262420; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-size: 14.8px; fill: #262420; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-size: 13.5px; fill: #5C5852; }
      .math { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 17px; fill: #262420; }
      .num { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-size: 18px; font-weight: 700; }
      .footer { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-size: 13px; fill: #5C5852; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FAF6EE"/>
  <text x="56" y="56" class="title">Handling Batch and Cell Heterogeneity in M. tuberculosis (MorphEUS)</text>
  <text x="56" y="86" class="subtitle">MIT 6.874 Lecture 20 (Part B · Bree Aldridge): why TVN, quartile features, and 70-trial consensus k-NN beat black-box CNNs</text>
  <line x1="56" y1="104" x2="1544" y2="104" stroke="#D6CEC0" stroke-width="1.5"/>
  
    <!-- Left Panel: TVN -->
    <rect x="56" y="124" width="692" height="700" rx="10" fill="#FFFDF9" stroke="#D6CEC0" stroke-width="1.5"/>
    <text x="84" y="164" class="panel-title">A. Typical Variation Normalization (TVN)</text>
    <text x="84" y="190" class="small">Constructed 2D check: per-batch control centering + pooled unregularized ZCA whitening</text>

    <!-- Before box -->
    <rect x="84" y="218" width="286" height="290" rx="8" fill="#F3ECE0" stroke="#D6CEC0" stroke-width="1"/>
    <text x="227" y="246" text-anchor="middle" class="label">Before TVN (Raw Space)</text>
    <line x1="100" y1="370" x2="354" y2="370" stroke="#D6CEC0" stroke-width="1"/>
    <line x1="227" y1="264" x2="227" y2="478" stroke="#D6CEC0" stroke-width="1"/>
    <ellipse cx="168.1" cy="404.8" rx="42" ry="30" fill="#356482" fill-opacity="0.10" stroke="#356482" stroke-dasharray="4,3"/>
    <ellipse cx="285.9" cy="335.2" rx="42" ry="30" fill="#A87919" fill-opacity="0.12" stroke="#A87919" stroke-dasharray="4,3"/>
    <circle cx="135.2" cy="423.4" r="5.2" fill="#356482" fill-opacity="0.78"/><circle cx="153.8" cy="380.4" r="5.2" fill="#356482" fill-opacity="0.78"/><circle cx="182.4" cy="429.2" r="5.2" fill="#356482" fill-opacity="0.78"/><circle cx="201.0" cy="386.2" r="5.2" fill="#356482" fill-opacity="0.78"/><circle cx="147.6" cy="400.2" r="5.2" fill="#356482" fill-opacity="0.78"/><circle cx="188.6" cy="409.4" r="5.2" fill="#356482" fill-opacity="0.78"/><circle cx="259.2" cy="348.0" r="5.2" fill="#A87919" fill-opacity="0.82"/><circle cx="277.8" cy="313.2" r="5.2" fill="#A87919" fill-opacity="0.82"/><circle cx="306.4" cy="357.2" r="5.2" fill="#A87919" fill-opacity="0.82"/><circle cx="312.6" cy="319.0" r="5.2" fill="#A87919" fill-opacity="0.82"/><circle cx="269.2" cy="324.8" r="5.2" fill="#A87919" fill-opacity="0.82"/><circle cx="290.2" cy="349.1" r="5.2" fill="#A87919" fill-opacity="0.82"/><rect x="123.0" y="361.7" width="9.6" height="9.6" fill="#B5493A" fill-opacity="0.88"/><rect x="134.2" y="347.8" width="9.6" height="9.6" fill="#B5493A" fill-opacity="0.88"/><rect x="144.1" y="357.1" width="9.6" height="9.6" fill="#B5493A" fill-opacity="0.88"/><rect x="238.3" y="296.8" width="9.6" height="9.6" fill="#B5493A" fill-opacity="0.88"/><rect x="249.5" y="279.4" width="9.6" height="9.6" fill="#B5493A" fill-opacity="0.88"/><rect x="261.9" y="291.0" width="9.6" height="9.6" fill="#B5493A" fill-opacity="0.88"/><polygon points="210.9,436.1 205.4,446.7 216.4,446.7" fill="#4B6B46" fill-opacity="0.88"/><polygon points="220.8,426.8 215.3,437.4 226.3,437.4" fill="#4B6B46" fill-opacity="0.88"/><polygon points="198.5,444.2 193.0,454.8 204.0,454.8" fill="#4B6B46" fill-opacity="0.88"/><polygon points="321.2,371.2 315.7,381.8 326.7,381.8" fill="#4B6B46" fill-opacity="0.88"/><polygon points="336.1,358.4 330.6,369.0 341.6,369.0" fill="#4B6B46" fill-opacity="0.88"/><polygon points="312.6,377.0 307.1,387.6 318.1,387.6" fill="#4B6B46" fill-opacity="0.88"/>
    <text x="227" y="498" text-anchor="middle" class="small">Batch shift separates same-drug replicates</text>

    <!-- Explicit polygon arrow -->
    <line x1="376.0" y1="365.0" x2="410.5" y2="365.0" stroke="#356482" stroke-width="2.5"/><polygon points="418.0,365.0 408.0,370.0 408.0,360.0" fill="#356482"/>
    <text x="397" y="346" text-anchor="middle" class="small" fill="#356482" font-weight="700">TVN</text>

    <!-- After box -->
    <rect x="424" y="218" width="296" height="290" rx="8" fill="#F3ECE0" stroke="#D6CEC0" stroke-width="1"/>
    <text x="572" y="246" text-anchor="middle" class="label">After TVN (Ideal: μ = 0, Σ = I)</text>
    <line x1="442" y1="370" x2="702" y2="370" stroke="#D6CEC0" stroke-width="1"/>
    <line x1="572" y1="264" x2="572" y2="478" stroke="#D6CEC0" stroke-width="1"/>
    <circle cx="572" cy="370" r="51" fill="#356482" fill-opacity="0.07" stroke="#5C5852" stroke-dasharray="4,3"/>
    <circle cx="523.3" cy="403.4" r="5.2" fill="#356482" fill-opacity="0.78"/><circle cx="549.4" cy="323.7" r="5.2" fill="#356482" fill-opacity="0.78"/><circle cx="594.6" cy="416.3" r="5.2" fill="#356482" fill-opacity="0.78"/><circle cx="620.7" cy="336.6" r="5.2" fill="#356482" fill-opacity="0.78"/><circle cx="540.9" cy="360.4" r="5.2" fill="#356482" fill-opacity="0.78"/><circle cx="603.1" cy="379.6" r="5.2" fill="#356482" fill-opacity="0.78"/><circle cx="532.4" cy="392.8" r="5.2" fill="#A87919" fill-opacity="0.82"/><circle cx="558.8" cy="328.3" r="5.2" fill="#A87919" fill-opacity="0.82"/><circle cx="603.9" cy="412.3" r="5.2" fill="#A87919" fill-opacity="0.82"/><circle cx="611.4" cy="340.7" r="5.2" fill="#A87919" fill-opacity="0.82"/><circle cx="546.3" cy="349.7" r="5.2" fill="#A87919" fill-opacity="0.82"/><circle cx="579.2" cy="396.3" r="5.2" fill="#A87919" fill-opacity="0.82"/><rect x="504.6" y="291.6" width="9.6" height="9.6" fill="#B5493A" fill-opacity="0.88"/><rect x="520.8" y="266.0" width="9.6" height="9.6" fill="#B5493A" fill-opacity="0.88"/><rect x="536.2" y="283.8" width="9.6" height="9.6" fill="#B5493A" fill-opacity="0.88"/><rect x="501.1" y="300.2" width="9.6" height="9.6" fill="#B5493A" fill-opacity="0.88"/><rect x="517.1" y="268.0" width="9.6" height="9.6" fill="#B5493A" fill-opacity="0.88"/><rect x="536.4" y="290.3" width="9.6" height="9.6" fill="#B5493A" fill-opacity="0.88"/><polygon points="638.2,435.7 632.7,446.3 643.7,446.3" fill="#4B6B46" fill-opacity="0.88"/><polygon points="652.8,418.8 647.3,429.4 658.3,429.4" fill="#4B6B46" fill-opacity="0.88"/><polygon points="619.9,450.4 614.4,461.0 625.4,461.0" fill="#4B6B46" fill-opacity="0.88"/><polygon points="627.2,444.1 621.7,454.7 632.7,454.7" fill="#4B6B46" fill-opacity="0.88"/><polygon points="649.1,420.8 643.6,431.4 654.6,431.4" fill="#4B6B46" fill-opacity="0.88"/><polygon points="614.4,454.6 608.9,465.2 619.9,465.2" fill="#4B6B46" fill-opacity="0.88"/>
    <text x="572" y="498" text-anchor="middle" class="small">Controls align; drugs cluster across batches</text>

    <!-- Legend -->
    <circle cx="94" cy="540" r="5.2" fill="#356482"/>
    <text x="106" y="545" class="small">Batch 1 untreated</text>
    <circle cx="244" cy="540" r="5.2" fill="#A87919"/>
    <text x="256" y="545" class="small">Batch 2 untreated</text>
    <rect x="394" y="535" width="9.6" height="9.6" fill="#B5493A"/>
    <text x="410" y="545" class="small">Drug A (both batches)</text>
    <polygon points="572,534 566,545 578,545" fill="#4B6B46"/>
    <text x="584" y="545" class="small">Drug B (both batches)</text>

    <!-- Experimental context callout -->
    <rect x="84" y="572" width="636" height="228" rx="8" fill="#E6EFF5" stroke="#356482" stroke-width="1.2"/>
    <text x="108" y="604" class="label" fill="#356482">Why standard E. coli profiling and CNNs failed on M. tuberculosis</text>
    <text x="108" y="634" class="body">• Mtb has a thick, waxy cell envelope (speaker: ~30× thicker than E. coli); imaging</text>
    <text x="122" y="656" class="body">showed uneven dye uptake, dark unstained cells, batch drift, and subtle shifts.</text>
    <text x="108" y="686" class="body">• The lab reported dedicating 25% of its imaging time to untreated controls across</text>
    <text x="122" y="708" class="body">biological and technical replicates (recording, 1:01:38).</text>
    <text x="108" y="738" class="body">• ~25 base metrics expand via median, Q1, Q3, IQR (~100/dose; ~200 paired low+high)</text>
    <text x="122" y="760" class="body">to represent single-cell heterogeneity explicitly before feature pruning.</text>

    <!-- Right Panel: MorphEUS 70-trial c-kNN -->
    <rect x="774" y="124" width="770" height="700" rx="10" fill="#FFFDF9" stroke="#D6CEC0" stroke-width="1.5"/>
    <text x="802" y="164" class="panel-title">B. MorphEUS: 70-Trial Stochastic Consensus (c-kNN)</text>
    <text x="802" y="190" class="small">Workflow from Part B p. 16 (Smith et al., PNAS 2020): resample controls to stabilize TVN</text>

    <!-- Flow Step 1 -->
    <rect x="820" y="216" width="676" height="74" rx="8" fill="#F3ECE0" stroke="#D6CEC0" stroke-width="1.2"/>
    <text x="844" y="246" class="label">1. Feature Quantification (~10,000 cells / treatment, low + high dose)</text>
    <text x="844" y="272" class="small">Segment single cells → filter out-of-focus cells → compute ~100 quartile features/dose</text>

    <line x1="1158.0" y1="290.0" x2="1158.0" y2="318.5" stroke="#262420" stroke-width="2.0"/><polygon points="1158.0,326.0 1153.0,316.0 1163.0,316.0" fill="#262420"/>

    <!-- 70-trial dashed container matching l20b p. 16 order -->
    <rect x="820" y="328" width="676" height="206" rx="10" fill="#F7EFE0" fill-opacity="0.55" stroke="#A87919" stroke-width="1.6" stroke-dasharray="6,4"/>
    <text x="844" y="358" class="label" fill="#A87919">2. Repeat 70 Stochastic Classification Trials (Part B p. 16)</text>

    <rect x="844" y="378" width="186" height="128" rx="7" fill="#FFFDF9" stroke="#A87919" stroke-width="1.2"/>
    <text x="937" y="408" text-anchor="middle" class="label">Resample Controls</text>
    <text x="937" y="434" text-anchor="middle" class="small">Draw untreated subset</text>
    <text x="937" y="454" text-anchor="middle" class="small">from control pool</text>
    <text x="937" y="476" text-anchor="middle" class="small">for this trial</text>

    <line x1="1030.0" y1="442.0" x2="1055.2" y2="442.0" stroke="#262420" stroke-width="1.8"/><polygon points="1062.0,442.0 1053.0,446.5 1053.0,437.5" fill="#262420"/>

    <rect x="1064" y="378" width="194" height="128" rx="7" fill="#FFFDF9" stroke="#A87919" stroke-width="1.2"/>
    <text x="1161" y="408" text-anchor="middle" class="label">mRMR + TVN</text>
    <text x="1161" y="434" text-anchor="middle" class="small">Rank features (mRMR)</text>
    <text x="1161" y="454" text-anchor="middle" class="small">and apply TVN inside</text>
    <text x="1161" y="476" text-anchor="middle" class="small">selection loop</text>

    <line x1="1258.0" y1="442.0" x2="1283.2" y2="442.0" stroke="#262420" stroke-width="1.8"/><polygon points="1290.0,442.0 1281.0,446.5 1281.0,437.5" fill="#262420"/>

    <rect x="1292" y="378" width="184" height="128" rx="7" fill="#FFFDF9" stroke="#A87919" stroke-width="1.2"/>
    <text x="1384" y="408" text-anchor="middle" class="label">k-NN + Prune</text>
    <text x="1384" y="434" text-anchor="middle" class="small">k-NN in PCA space;</text>
    <text x="1384" y="454" text-anchor="middle" class="small">backward selection</text>
    <text x="1384" y="476" text-anchor="middle" class="small">(~35–40 features kept)</text>

    <line x1="1158.0" y1="534.0" x2="1158.0" y2="560.5" stroke="#262420" stroke-width="2.0"/><polygon points="1158.0,568.0 1153.0,558.0 1163.0,558.0" fill="#262420"/>

    <rect x="820" y="570" width="676" height="82" rx="8" fill="#E8F0E6" stroke="#4B6B46" stroke-width="1.5"/>
    <text x="844" y="600" class="label" fill="#4B6B46">3. Consensus Classification (c-kNN: 34 TB drugs, 5 MoA classes)</text>
    <text x="844" y="628" class="body">Tabulate 70 trials → 94% reference accuracy, 76% cross-validation accuracy (Part B p. 18).</text>

    <!-- Bedaquiline Discovery Box -->
    <rect x="820" y="676" width="676" height="124" rx="8" fill="#F8E8E5" stroke="#B5493A" stroke-width="1.2"/>
    <text x="844" y="706" class="label" fill="#B5493A">Investigator Interpretation: The Bedaquiline Paradox (Part B pp. 20–22)</text>
    <text x="844" y="734" class="body">• Bedaquiline (ATP synthase inhibitor) clustered with cell-wall drugs in rich sugar media.</text>
    <text x="844" y="758" class="body">• On fatty acids, that resemblance vanished: investigators attributed the sugar</text>
    <text x="858" y="780" class="body">phenotype to ATP depletion causing secondary cell-wall failure (proximal damage).</text>
    
  <line x1="56" y1="846" x2="1544" y2="846" stroke="#D6CEC0" stroke-width="1"/>
  <text x="56" y="872" class="footer">Panel A: constructed 2D unregularized TVN illustration (after Ando et al., bioRxiv 2017). Panel B: reported MorphEUS workflow and metrics (Part B pp. 14–22; Smith et al., PNAS 2020).</text>
</svg>

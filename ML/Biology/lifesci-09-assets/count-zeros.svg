<svg role="img" aria-labelledby="figure-title figure-desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="864pt" height="504pt" viewBox="0 0 864 504" xmlns="http://www.w3.org/2000/svg" version="1.1">
<title id="figure-title">count zeros</title>
<desc id="figure-desc">A zero count does not identify its cause. Theoretical distributions: negative binomial component mean mu = 2 and dispersion theta = 2; zero-inflated mixture pi = 0.25. At count zero, probabilities are NB 0.25 and ZINB 0.4375. Means are NB 2 and mixture (1 - 0.25) times 2 = 1.5. Horizontal axis: observed count, 0 through 10. Vertical axis: probability, from zero. Tail probabilities above 10 are NB 0.003174 and mixture 0.002380. NB itself can produce zeros. The added mixture component is a modeling assumption.</desc>



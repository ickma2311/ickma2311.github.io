  <g id="text_39">
   <text style="fill: #24312e; font: 29px 'DejaVu Sans'; text-anchor: middle" x="576" y="61.042344" transform="rotate(-0 576 61.042344)">KL(P || Q) penalizes losing a high-affinity pair</text>
  </g>
  <g id="text_40">
   <text style="fill: #24312e; font: 21px 'DejaVu Sans'; text-anchor: middle" x="576" y="97.2" transform="rotate(-0 576 97.2)">P = input affinities       Q = candidate map affinities</text>
  </g>
  <g id="text_41">
   <text style="fill: #24312e; font: 18px 'DejaVu Sans'; text-anchor: start" x="86.4" y="583.2" transform="rotate(-0 86.4 583.2)">Constructed normalized distributions over three abstract pair categories.</text>
  </g>
  <g id="text_42">
   <text style="fill: #24312e; font: 18px 'DejaVu Sans'; text-anchor: start" x="86.4" y="612.36" transform="rotate(-0 86.4 612.36)">Illustrates the loss direction; these are not fitted t-SNE embeddings.</text>
  </g>
 </g>

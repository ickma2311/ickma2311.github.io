   <g id="text_1">
    <text style="font-weight: 700; font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24312e" x="46.8" y="46.8" transform="rotate(-0 46.8 46.8)">A tuple output routes every contribution</text>
   </g>
   <g id="text_2">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52635d" x="46.8" y="86.4" transform="rotate(-0 46.8 86.4)">Constructed scalar example · F(x) = (x+1, x+2) · x = 1 · L = 3u + 4v</text>
   </g>
   <g id="text_3">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #24312e" x="126" y="312.197031" transform="rotate(-0 126 312.197031)">x = 1</text>
   </g>
   <g id="text_4">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #24312e" x="370.8" y="311.328438" transform="rotate(-0 370.8 311.328438)">F(x) = (2, 3)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #24312e" x="676.8" y="222.187734" transform="rotate(-0 676.8 222.187734)">u = x+1 = 2</text>
   </g>
   <g id="text_6">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #24312e" x="676.8" y="402.187734" transform="rotate(-0 676.8 402.187734)">v = x+2 = 3</text>
   </g>
   <g id="text_7">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #52635d" x="529.2" y="252.36" transform="rotate(-0 529.2 252.36)">index 0</text>
   </g>
   <g id="text_8">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #52635d" x="529.2" y="353.16" transform="rotate(-0 529.2 353.16)">index 1</text>
   </g>
   <g id="text_9">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #24312e" x="972" y="312.915703" transform="rotate(-0 972 312.915703)">L = 3u+4v = 18</text>
   </g>
   <g id="text_10">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #98533f" x="612" y="284.4" transform="rotate(-0 612 284.4)">upstream: 3</text>
   </g>
   <g id="text_11">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #98533f" x="612" y="464.4" transform="rotate(-0 612 464.4)">upstream: 4</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(223.2 415.65)">Tuple gradient: (3, 4)</text>
    <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(223.2 453.6)">Input gradient: 3 + 4 = 7</text>
   </g>
   <g id="text_13">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24312e" x="57.6" y="573.84" transform="rotate(-0 57.6 573.84)">Only u used, unit upstream gradient: tuple adjoint (1, 0) → input gradient 1.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52635d" x="57.6" y="615.6" transform="rotate(-0 57.6 615.6)">The operator abstraction supplies gradient routing. It does not by itself establish GPU kernel fusion or speedup.</text>
   </g>

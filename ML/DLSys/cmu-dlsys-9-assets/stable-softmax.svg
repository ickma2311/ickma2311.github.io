   <g id="text_1">
    <text style="font-weight: 700; font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24312e" x="46.8" y="46.8" transform="rotate(-0 46.8 46.8)">Stable softmax changes the arithmetic</text>
   </g>
   <g id="text_2">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52635d" x="46.8" y="86.4" transform="rotate(-0 46.8 86.4)">Same finite float32 logits in both paths: [100, 100, 101] · normalize one vector over its three classes</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #98533f" x="57.6" y="144" transform="rotate(-0 57.6 144)">DIRECT EXPONENTIALS</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #3c665b" x="590.4" y="144" transform="rotate(-0 590.4 144)">SUBTRACT THE MAXIMUM</text>
   </g>
   <g id="text_5">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #24312e" x="273.6" y="213.907656" transform="rotate(-0 273.6 213.907656)">z = [100, 100, 101]</text>
   </g>
   <g id="text_6">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #24312e" x="806.4" y="213.907656" transform="rotate(-0 806.4 213.907656)">z − max(z) = [−1, −1, 0]</text>
   </g>
   <g id="text_7">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #24312e" x="273.6" y="356.51875" transform="rotate(-0 273.6 356.51875)">exp(z) overflows in float32</text>
   </g>
   <g id="text_8">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #24312e" x="806.4" y="355.966875" transform="rotate(-0 806.4 355.966875)">exp(z − max(z)) ≈ [0.368, 0.368, 1]</text>
   </g>
   <g id="text_9">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #24312e" x="273.6" y="497.470625" transform="rotate(-0 273.6 497.470625)">p = [NaN, NaN, NaN]</text>
   </g>
   <g id="text_10">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #24312e" x="806.4" y="496.91875" transform="rotate(-0 806.4 496.91875)">p ≈ [0.21194, 0.21194, 0.57612]</text>
   </g>
   <g id="text_11">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24312e" x="57.6" y="586.8" transform="rotate(-0 57.6 586.8)">A common shift cancels in the ratio. For finite logits, the largest shifted exponential is exactly 1.</text>
   </g>
   <g id="text_12">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52635d" x="57.6" y="622.8" transform="rotate(-0 57.6 622.8)">Underflow can still round tiny probabilities to zero; compute log-softmax directly when log probabilities are needed.</text>
   </g>
  </g>

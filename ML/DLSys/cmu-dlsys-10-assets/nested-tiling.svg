   <g id="text_1">
    <text style="fill: #24312e; font: 700 30px 'DejaVu Sans'; text-anchor: start" x="50.4" y="59.76" transform="rotate(-0 50.4 59.76)">Two working sets, two levels of reuse</text>
   </g>
   <g id="text_2">
    <text style="fill: #24312e; font: 18px 'DejaVu Sans'; text-anchor: start" x="50.4" y="103.68" transform="rotate(-0 50.4 103.68)">Conceptual CPU hierarchy · square inputs · C = A Bᵀ · divisible tile sizes</text>
   </g>
   <g id="text_3">
    <text style="fill: #24312e; font: 24px 'DejaVu Sans'" transform="translate(160.539375 246.049687)">DRAM</text>
    <text style="fill: #24312e; font: 24px 'DejaVu Sans'" transform="translate(108.804375 278.395312)">A and B: n × n</text>
   </g>
   <g id="text_4">
    <text style="fill: #24312e; font: 23px 'DejaVu Sans'" transform="translate(489.287734 230.948672)">L1 input panels</text>
    <text style="fill: #24312e; font: 23px 'DejaVu Sans'" transform="translate(526.459688 261.946563)">A: b₁ × n</text>
    <text style="fill: #24312e; font: 23px 'DejaVu Sans'" transform="translate(526.235078 292.944453)">B: b₂ × n</text>
   </g>
   <g id="text_5">
    <text style="fill: #24312e; font: 21px 'DejaVu Sans'" transform="translate(868.798359 233.092266)">Register microtile</text>
    <text style="fill: #24312e; font: 21px 'DejaVu Sans'" transform="translate(910.672031 261.394688)">C: v₁ × v₂</text>
    <text style="fill: #24312e; font: 21px 'DejaVu Sans'" transform="translate(860.718281 289.697109)">Keep accumulators</text>
   </g>
   <g id="text_6">
    <text style="fill: #24312e; font: 19px 'DejaVu Sans'; text-anchor: start" x="61.2" y="410.4" transform="rotate(-0 61.2 410.4)">Retain A panel while cycling through B panels; reuse within each output microtile.</text>
   </g>
   <g id="text_7">
    <text style="fill: #24312e; font: 700 22px 'DejaVu Sans'; text-anchor: start" x="68.4" y="471.6" transform="rotate(-0 68.4 471.6)">DRAM → L1 input loads</text>
   </g>
   <g id="text_8">
    <text style="fill: #24312e; font: 26px 'DejaVu Sans'; text-anchor: start" x="68.4" y="521.28" transform="rotate(-0 68.4 521.28)">n² + n³ / b₁</text>
   </g>
   <g id="text_9">
    <text style="fill: #24312e; font: 700 22px 'DejaVu Sans'; text-anchor: start" x="615.6" y="471.6" transform="rotate(-0 615.6 471.6)">L1 → register input loads</text>
   </g>
   <g id="text_10">
    <text style="fill: #24312e; font: 26px 'DejaVu Sans'; text-anchor: start" x="615.6" y="521.28" transform="rotate(-0 615.6 521.28)">n³ / v₂ + n³ / v₁</text>
   </g>
   <g id="text_11">
    <text style="fill: #24312e; font: 18px 'DejaVu Sans'; text-anchor: start" x="68.4" y="591.12" transform="rotate(-0 68.4 591.12)">Input-panel capacity: e n(b₁+b₂) bytes. Leave room for output traffic and other live data.</text>
   </g>
   <g id="text_12">
    <text style="fill: #24312e; font: 17px 'DejaVu Sans'; text-anchor: start" x="68.4" y="625.68" transform="rotate(-0 68.4 625.68)">Idealized load counts; hardware manages CPU caches. Capacity alone does not guarantee residency.</text>
   </g>
  </g>

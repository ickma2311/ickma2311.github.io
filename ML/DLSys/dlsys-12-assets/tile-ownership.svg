  </g>
  <g id="text_7">
   <text style="fill: #24312e; font: 15px 'DejaVu Sans'; text-anchor: start" x="423.36" y="221.76" transform="rotate(-0 423.36 221.76)">Load → barrier → consume → barrier</text>
  </g>
  <g id="text_8">
   <text style="fill: #496653; font: 16px 'DejaVu Sans'; text-anchor: start" x="423.36" y="267.12" transform="rotate(-0 423.36 267.12)">Each thread keeps V² accumulators</text>
  </g>
  <g id="text_9">
   <text style="fill: #24312e; font: 16px 'DejaVu Sans'; text-anchor: start" x="423.36" y="307.44" transform="rotate(-0 423.36 307.44)">and reuses 2V operands per k step.</text>
  </g>
  <g id="text_10">
   <text style="fill: #24312e; font: 700 20px 'DejaVu Sans'; text-anchor: start" x="51.84" y="383.04" transform="rotate(-0 51.84 383.04)">Constructed configuration:  L = 32,  V = 4,  S = 8</text>
  </g>
  <g id="text_11">
   <text style="fill: #24312e; font: 17px 'DejaVu Sans'; text-anchor: start" x="51.84" y="423.36" transform="rotate(-0 51.84 423.36)">Threads: (L/V)² = 64       Shared storage: 2SL × 4 bytes = 2 KiB</text>
  </g>
  <g id="text_12">
   <text style="fill: #24312e; font: 14px 'DejaVu Sans'; text-anchor: start" x="43.2" y="471.24" transform="rotate(-0 43.2 471.24)">The thread loading an input may be different from the thread that consumes it.</text>
  </g>
 </g>

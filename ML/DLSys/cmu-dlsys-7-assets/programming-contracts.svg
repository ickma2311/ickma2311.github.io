   <g id="text_11">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #984b38" x="61.92" y="447.12" transform="rotate(-0 61.92 447.12)">Eager / define-by-run</text>
   </g>
   <g id="text_12">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #302e2a" x="61.92" y="491.597812" transform="rotate(-0 61.92 491.597812)">Execute operations → record graph</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #984b38" x="407.52" y="447.12" transform="rotate(-0 407.52 447.12)">What the interface lets you do</text>
   </g>
   <g id="text_14">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(407.52 491.597812)">Values appear as operations run; Python can branch.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(407.52 511.529875)">If v₄ &gt; 0.5: v₅ = 2v₄. Here v₅ = 4.</text>
   </g>

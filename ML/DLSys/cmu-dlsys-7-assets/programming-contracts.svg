   <g id="text_1">
    <text style="font-weight: 700; font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #302e2a" x="46.8" y="61.2" transform="rotate(-0 46.8 61.2)">The same formula, three programming contracts</text>
   </g>
   <g id="text_2">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #302e2a" x="46.8" y="97.2" transform="rotate(-0 46.8 97.2)">Historical lecture comparison · v₂ = exp(v₁), v₃ = v₂ + 1, v₄ = v₂v₃ · at v₁ = 0: (1, 2, 2)</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #365e78" x="61.92" y="151.92" transform="rotate(-0 61.92 151.92)">Caffe 1.0</text>
   </g>
   <g id="text_4">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #302e2a" x="61.92" y="196.397812" transform="rotate(-0 61.92 196.397812)">Layer.forward / Layer.backward</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #365e78" x="407.52" y="151.92" transform="rotate(-0 407.52 151.92)">What the interface lets you do</text>
   </g>
   <g id="text_6">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(407.52 196.397812)">Implement each layer’s forward and local backward.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(407.52 216.329875)">Reuse activation buffers; execute layers in order.</text>
   </g>

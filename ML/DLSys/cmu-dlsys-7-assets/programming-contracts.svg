   <g id="text_7">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526746" x="61.92" y="299.52" transform="rotate(-0 61.92 299.52)">TensorFlow 1.0</text>
   </g>
   <g id="text_8">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #302e2a" x="61.92" y="343.997812" transform="rotate(-0 61.92 343.997812)">Declare graph → execute fetch</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526746" x="407.52" y="299.52" transform="rotate(-0 407.52 299.52)">What the interface lets you do</text>
   </g>
   <g id="text_10">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(407.52 343.997812)">Define v₂, v₃, v₄ first; then request a value.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(407.52 363.929875)">Fetching only v₃ need not execute v₄.</text>
   </g>

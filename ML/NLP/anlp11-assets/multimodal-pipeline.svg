<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#FAF6EE" />
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="70" y="96" font-size="44" font-weight="700" fill="#1F2A2E">Three Bridges From Pixels to Language Models</text>
    <rect x="70.0" y="315.0" width="200.0" height="140.0" rx="14" fill="#F3EEE3" stroke="#4B5558" stroke-width="2.2" />
    <text x="170.0" y="373.8" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2A2E">Image</text>
    <text x="170.0" y="418.6" text-anchor="middle" font-size="21" fill="#5A554E">H×W×C</text><rect x="70.0" y="495.0" width="200.0" height="100.0" rx="14" fill="#ECF2EB" stroke="#4B6B46" stroke-width="2.2" />
    <text x="170.0" y="537.0" text-anchor="middle" font-size="24" font-weight="700" fill="#344E30">Caption y</text>
    <text x="170.0" y="569.0" text-anchor="middle" font-size="20" fill="#364635">Text pairs</text><line x1="270.0" y1="355.0" x2="357.9" y2="234.7" stroke="#356482" stroke-width="3.2" stroke-linecap="round" /><polygon points="365.0,225.0 361.2,242.0 349.9,233.8" fill="#356482" /><rect x="370.0" y="165.0" width="300.0" height="120.0" rx="14" fill="#EBF1F5" stroke="#356482" stroke-width="2.2" />
    <text x="520.0" y="215.4" text-anchor="middle" font-size="25" font-weight="700" fill="#23475E">Patch + Project</text>
    <text x="520.0" y="253.8" text-anchor="middle" font-size="20" fill="#33434A">N×D embeddings</text><line x1="670.0" y1="225.0" x2="733.0" y2="225.0" stroke="#356482" stroke-width="3.2" stroke-linecap="round" /><polygon points="745.0,225.0 729.0,232.0 729.0,218.0" fill="#356482" /><rect x="750.0" y="165.0" width="290.0" height="120.0" rx="14" fill="#EBF1F5" stroke="#356482" stroke-width="2.2" />
    <text x="895.0" y="215.4" text-anchor="middle" font-size="25" font-weight="700" fill="#23475E">ViT Encoder</text>
    <text x="895.0" y="253.8" text-anchor="middle" font-size="20" fill="#33434A">Transformer</text><line x1="1040.0" y1="225.0" x2="1103.0" y2="225.0" stroke="#356482" stroke-width="3.2" stroke-linecap="round" /><polygon points="1115.0,225.0 1099.0,232.0 1099.0,218.0" fill="#356482" /><rect x="1120.0" y="165.0" width="405.0" height="120.0" rx="14" fill="#EBF1F5" stroke="#356482" stroke-width="2.2" />
    <text x="1322.5" y="215.4" text-anchor="middle" font-size="25" font-weight="700" fill="#23475E">Class Logits</text>
    <text x="1322.5" y="253.8" text-anchor="middle" font-size="20" fill="#33434A">Supervised labels</text><line x1="270.0" y1="405.0" x2="353.0" y2="405.0" stroke="#4B6B46" stroke-width="3.2" stroke-linecap="round" /><polygon points="365.0,405.0 349.0,412.0 349.0,398.0" fill="#4B6B46" /><line x1="270.0" y1="545.0" x2="353.4" y2="523.1" stroke="#4B6B46" stroke-width="3.2" stroke-linecap="round" /><polygon points="365.0,520.0 351.3,530.8 347.7,517.3" fill="#4B6B46" /><rect x="370.0" y="360.0" width="300.0" height="88.0" rx="14" fill="#ECF2EB" stroke="#4B6B46" stroke-width="2.2" />
    <text x="520.0" y="397.0" text-anchor="middle" font-size="24" font-weight="700" fill="#344E30">Image Encoder</text>
    <text x="520.0" y="425.1" text-anchor="middle" font-size="20" fill="#364635">f_I(x)</text><rect x="370.0" y="474.0" width="300.0" height="88.0" rx="14" fill="#ECF2EB" stroke="#4B6B46" stroke-width="2.2" />
    <text x="520.0" y="511.0" text-anchor="middle" font-size="24" font-weight="700" fill="#344E30">Text Encoder</text>
    <text x="520.0" y="539.1" text-anchor="middle" font-size="20" fill="#364635">f_T(y)</text><line x1="670.0" y1="404.0" x2="734.4" y2="438.4" stroke="#4B6B46" stroke-width="3.0" stroke-linecap="round" /><polygon points="745.0,444.0 727.6,442.6 734.2,430.3" fill="#4B6B46" /><line x1="670.0" y1="518.0" x2="734.4" y2="483.6" stroke="#4B6B46" stroke-width="3.0" stroke-linecap="round" /><polygon points="745.0,478.0 734.2,491.7 727.6,479.4" fill="#4B6B46" /><rect x="750.0" y="400.0" width="290.0" height="122.0" rx="14" fill="#ECF2EB" stroke="#4B6B46" stroke-width="2.2" />
    <text x="895.0" y="451.2" text-anchor="middle" font-size="25" font-weight="700" fill="#344E30">Cosine Matrix</text>
    <text x="895.0" y="490.3" text-anchor="middle" font-size="20" fill="#364635">B×B batch scores</text><line x1="1040.0" y1="461.0" x2="1103.0" y2="461.0" stroke="#4B6B46" stroke-width="3.2" stroke-linecap="round" /><polygon points="1115.0,461.0 1099.0,468.0 1099.0,454.0" fill="#4B6B46" /><rect x="1120.0" y="400.0" width="405.0" height="122.0" rx="14" fill="#ECF2EB" stroke="#4B6B46" stroke-width="2.2" />
    <text x="1322.5" y="451.2" text-anchor="middle" font-size="25" font-weight="700" fill="#344E30">Symmetric InfoNCE</text>
    <text x="1322.5" y="490.3" text-anchor="middle" font-size="20" fill="#364635">Mean row + col CE</text><line x1="270.0" y1="435.0" x2="360.9" y2="683.7" stroke="#A87919" stroke-width="3.2" stroke-linecap="round" /><polygon points="365.0,695.0 352.9,682.4 366.1,677.6" fill="#A87919" /><rect x="370.0" y="635.0" width="300.0" height="120.0" rx="14" fill="#F6F0E1" stroke="#A87919" stroke-width="2.2" />
    <text x="520.0" y="685.4" text-anchor="middle" font-size="25" font-weight="700" fill="#7A5710">CLIP ViT</text>
    <text x="520.0" y="723.8" text-anchor="middle" font-size="20" fill="#473E2C">Patch tokens</text><line x1="670.0" y1="695.0" x2="733.0" y2="695.0" stroke="#A87919" stroke-width="3.2" stroke-linecap="round" /><polygon points="745.0,695.0 729.0,702.0 729.0,688.0" fill="#A87919" /><rect x="750.0" y="635.0" width="290.0" height="120.0" rx="14" fill="#F6F0E1" stroke="#A87919" stroke-width="2.2" />
    <text x="895.0" y="685.4" text-anchor="middle" font-size="25" font-weight="700" fill="#7A5710">Connector W</text>
    <text x="895.0" y="723.8" text-anchor="middle" font-size="20" fill="#473E2C">LLM dimension</text><line x1="1040.0" y1="695.0" x2="1103.0" y2="695.0" stroke="#B5493A" stroke-width="3.2" stroke-linecap="round" /><polygon points="1115.0,695.0 1099.0,702.0 1099.0,688.0" fill="#B5493A" /><rect x="1120.0" y="635.0" width="405.0" height="120.0" rx="14" fill="#FAECE9" stroke="#B5493A" stroke-width="2.2" />
    <text x="1322.5" y="685.4" text-anchor="middle" font-size="25" font-weight="700" fill="#7A2D22">Language Model</text>
    <text x="1322.5" y="723.8" text-anchor="middle" font-size="20" fill="#52322D">Text loss only</text>
  </g>
</svg>

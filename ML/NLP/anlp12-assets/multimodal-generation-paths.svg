<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#FAF6EE" />
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="90" y="102" font-size="44" font-weight="700" fill="#1F2A2E">Two Bridges from Text Prompts to Generated Pixels</text>
    <text x="90" y="215" font-size="27" font-weight="700" fill="#356482">1. Early Fusion (Chameleon / Liquid)</text><rect x="90.0" y="248.0" width="275.0" height="130.0" rx="16" fill="#EBF1F5" stroke="#356482" stroke-width="2.4" />
    <text x="227.5" y="303.9" text-anchor="middle" font-size="26" font-weight="700" fill="#23475E">Text + Image</text>
    <text x="227.5" y="344.2" text-anchor="middle" font-size="21" fill="#33434A">Mixed prompt</text><line x1="365.0" y1="313.0" x2="428.0" y2="313.0" stroke="#356482" stroke-width="3.4" stroke-linecap="round" /><polygon points="440.0,313.0 424.0,320.0 424.0,306.0" fill="#356482" /><rect x="445.0" y="248.0" width="310.0" height="130.0" rx="16" fill="#ECF2EB" stroke="#4B6B46" stroke-width="2.4" />
    <text x="600.0" y="303.9" text-anchor="middle" font-size="26" font-weight="700" fill="#2E472B">BPE + VQ-GAN</text>
    <text x="600.0" y="344.2" text-anchor="middle" font-size="21" fill="#364635">Token IDs</text><line x1="755.0" y1="313.0" x2="818.0" y2="313.0" stroke="#356482" stroke-width="3.4" stroke-linecap="round" /><polygon points="830.0,313.0 814.0,320.0 814.0,306.0" fill="#356482" /><rect x="835.0" y="248.0" width="335.0" height="130.0" rx="16" fill="#EBF1F5" stroke="#356482" stroke-width="2.4" />
    <text x="1002.5" y="303.9" text-anchor="middle" font-size="26" font-weight="700" fill="#23475E">Single Transformer</text>
    <text x="1002.5" y="344.2" text-anchor="middle" font-size="21" fill="#33434A">Next-token CE</text><line x1="1170.0" y1="313.0" x2="1233.0" y2="313.0" stroke="#356482" stroke-width="3.4" stroke-linecap="round" /><polygon points="1245.0,313.0 1229.0,320.0 1229.0,306.0" fill="#356482" /><rect x="1250.0" y="248.0" width="260.0" height="130.0" rx="16" fill="#ECF2EB" stroke="#4B6B46" stroke-width="2.4" />
    <text x="1380.0" y="303.9" text-anchor="middle" font-size="26" font-weight="700" fill="#2E472B">Detokenizer</text>
    <text x="1380.0" y="344.2" text-anchor="middle" font-size="21" fill="#364635">Pixels x̂</text><line x1="90" y1="465" x2="1510" y2="465" stroke="#DDD6C7" stroke-width="2" stroke-dasharray="8 8" /><text x="90" y="545" font-size="27" font-weight="700" fill="#B5493A">2. Continuous Latents + Diffusion (DALL-E 2)</text><rect x="90.0" y="578.0" width="275.0" height="130.0" rx="16" fill="#F8EFE0" stroke="#A87919" stroke-width="2.4" />
    <text x="227.5" y="633.9" text-anchor="middle" font-size="26" font-weight="700" fill="#6F4E0C">Text Prompt</text>
    <text x="227.5" y="674.2" text-anchor="middle" font-size="21" fill="#5B4A23">x<tspan baseline-shift="sub" font-size="18">T</tspan></text><line x1="365.0" y1="643.0" x2="428.0" y2="643.0" stroke="#B5493A" stroke-width="3.4" stroke-linecap="round" /><polygon points="440.0,643.0 424.0,650.0 424.0,636.0" fill="#B5493A" /><rect x="445.0" y="578.0" width="310.0" height="130.0" rx="16" fill="#F8EFE0" stroke="#A87919" stroke-width="2.4" />
    <text x="600.0" y="633.9" text-anchor="middle" font-size="26" font-weight="700" fill="#6F4E0C">CLIP Text</text>
    <text x="600.0" y="674.2" text-anchor="middle" font-size="21" fill="#5B4A23">Embedding z<tspan baseline-shift="sub" font-size="18">T</tspan></text><line x1="755.0" y1="643.0" x2="818.0" y2="643.0" stroke="#B5493A" stroke-width="3.4" stroke-linecap="round" /><polygon points="830.0,643.0 814.0,650.0 814.0,636.0" fill="#B5493A" /><rect x="835.0" y="578.0" width="335.0" height="130.0" rx="16" fill="#F8EBE8" stroke="#B5493A" stroke-width="2.4" />
    <text x="1002.5" y="633.9" text-anchor="middle" font-size="26" font-weight="700" fill="#7A2D22">Diffusion Prior</text>
    <text x="1002.5" y="674.2" text-anchor="middle" font-size="21" fill="#5C352E">p(z<tspan baseline-shift="sub" font-size="18">I</tspan> | z<tspan baseline-shift="sub" font-size="18">T</tspan>)</text><line x1="1170.0" y1="643.0" x2="1233.0" y2="643.0" stroke="#B5493A" stroke-width="3.4" stroke-linecap="round" /><polygon points="1245.0,643.0 1229.0,650.0 1229.0,636.0" fill="#B5493A" /><rect x="1250.0" y="578.0" width="260.0" height="130.0" rx="16" fill="#F8EBE8" stroke="#B5493A" stroke-width="2.4" />
    <text x="1380.0" y="633.9" text-anchor="middle" font-size="26" font-weight="700" fill="#7A2D22">Diffusion Decoder</text>
    <text x="1380.0" y="674.2" text-anchor="middle" font-size="21" fill="#5C352E">1024×1024 x<tspan baseline-shift="sub" font-size="18">I</tspan></text>
  </g>
</svg>

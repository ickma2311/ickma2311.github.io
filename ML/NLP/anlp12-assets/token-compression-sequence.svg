<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#FAF6EE" />
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="90" y="96" font-size="44" font-weight="700" fill="#1F2A2E">Visual Tokenization Compresses Sequence Length</text>
    <text x="90" y="144" font-size="24" fill="#6B655B">Discrete 32×32 VQ codes cut 256×256 steps by 64× (derived 192× vs RGB)</text>
    <text x="420.0" y="776" text-anchor="middle" font-size="22" font-weight="600" fill="#6B655B">10²</text><line x1="613.4" y1="195" x2="613.4" y2="735" stroke="#DDD6C7" stroke-width="2" stroke-dasharray="6 6" /><text x="613.4" y="776" text-anchor="middle" font-size="22" font-weight="600" fill="#6B655B">10³</text><line x1="806.9" y1="195" x2="806.9" y2="735" stroke="#DDD6C7" stroke-width="2" stroke-dasharray="6 6" /><text x="806.9" y="776" text-anchor="middle" font-size="22" font-weight="600" fill="#6B655B">10⁴</text><line x1="1000.3" y1="195" x2="1000.3" y2="735" stroke="#DDD6C7" stroke-width="2" stroke-dasharray="6 6" /><text x="1000.3" y="776" text-anchor="middle" font-size="22" font-weight="600" fill="#6B655B">10⁵</text><line x1="1193.7" y1="195" x2="1193.7" y2="735" stroke="#DDD6C7" stroke-width="2" stroke-dasharray="6 6" /><text x="1193.7" y="776" text-anchor="middle" font-size="22" font-weight="600" fill="#6B655B">10⁶</text><line x1="420.0" y1="195" x2="420.0" y2="735" stroke="#8C8375" stroke-width="2.5" /><text x="396.0" y="270.9" text-anchor="end" font-size="25" font-weight="700" fill="#1F2A2E">1024×1024 RGB subpixels</text><rect x="420.0" y="230.0" width="870.0" height="66.0" rx="10" fill="#B5493A" /><text x="1308.0" y="270.9" text-anchor="start" font-size="23" font-weight="700" fill="#B5493A">3,145,728 tokens</text><text x="396.0" y="402.9" text-anchor="end" font-size="25" font-weight="700" fill="#1F2A2E">256×256 RGB subpixels</text><rect x="420.0" y="362.0" width="637.1" height="66.0" rx="10" fill="#A87919" /><text x="1075.1" y="402.9" text-anchor="start" font-size="23" font-weight="700" fill="#A87919">196,608 tokens</text><text x="396.0" y="534.9" text-anchor="end" font-size="25" font-weight="700" fill="#1F2A2E">256×256 spatial grid</text><rect x="420.0" y="494.0" width="544.8" height="66.0" rx="10" fill="#356482" /><text x="982.8" y="534.9" text-anchor="start" font-size="23" font-weight="700" fill="#356482">65,536 spatial positions</text><text x="396.0" y="666.9" text-anchor="end" font-size="25" font-weight="700" fill="#1F2A2E">32×32 VQ token grid</text><rect x="420.0" y="626.0" width="195.4" height="66.0" rx="10" fill="#4B6B46" /><text x="633.4" y="666.9" text-anchor="start" font-size="23" font-weight="700" fill="#4B6B46">1,024 tokens</text>
    <text x="855" y="838" text-anchor="middle" font-size="23" font-weight="600" fill="#4B5558">Sequence length (log₁₀ scale)</text>

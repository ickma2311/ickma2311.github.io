<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#FAF6EE" />
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="80" y="96" font-size="44" font-weight="700" fill="#1F2A2E">Straight-Through Gradient Bypasses Discrete Lookup</text>
    <rect x="650.0" y="175.0" width="300.0" height="125.0" rx="16" fill="#ECF2EB" stroke="#4B6B46" stroke-width="2.4" />
    <text x="800.0" y="228.8" text-anchor="middle" font-size="26" font-weight="700" fill="#2E472B">Codebook E</text>
    <text x="800.0" y="267.5" text-anchor="middle" font-size="21" fill="#364635">K vectors in ℝᵈ</text><rect x="75.0" y="420.0" width="210.0" height="130.0" rx="16" fill="#F3EEE3" stroke="#7A7367" stroke-width="2.4" />
    <text x="180.0" y="475.9" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2A2E">Image x</text>
    <text x="180.0" y="516.2" text-anchor="middle" font-size="21" fill="#5A554E">Input pixels</text><line x1="285.0" y1="485.0" x2="343.0" y2="485.0" stroke="#356482" stroke-width="3.4" stroke-linecap="round" /><polygon points="355.0,485.0 339.0,492.0 339.0,478.0" fill="#356482" /><rect x="360.0" y="420.0" width="230.0" height="130.0" rx="16" fill="#EBF1F5" stroke="#356482" stroke-width="2.4" />
    <text x="475.0" y="475.9" text-anchor="middle" font-size="26" font-weight="700" fill="#23475E">Encoder</text>
    <text x="475.0" y="516.2" text-anchor="middle" font-size="21" fill="#33434A">z<tspan baseline-shift="sub" font-size="18">e</tspan>(x) ∈ ℝᵈ</text><line x1="590.0" y1="485.0" x2="653.0" y2="485.0" stroke="#356482" stroke-width="3.4" stroke-linecap="round" /><polygon points="665.0,485.0 649.0,492.0 649.0,478.0" fill="#356482" /><rect x="670.0" y="420.0" width="260.0" height="130.0" rx="16" fill="#F8EFE0" stroke="#A87919" stroke-width="2.4" stroke-dasharray="10 7" />
    <text x="800.0" y="475.9" text-anchor="middle" font-size="26" font-weight="700" fill="#6F4E0C">Quantizer</text>
    <text x="800.0" y="516.2" text-anchor="middle" font-size="21" fill="#5B4A23">z<tspan baseline-shift="sub" font-size="18">q</tspan> = e<tspan baseline-shift="sub" font-size="18">k*</tspan> (nearest e<tspan baseline-shift="sub" font-size="18">j</tspan>)</text><line x1="930.0" y1="485.0" x2="993.0" y2="485.0" stroke="#356482" stroke-width="3.4" stroke-linecap="round" /><polygon points="1005.0,485.0 989.0,492.0 989.0,478.0" fill="#356482" /><rect x="1010.0" y="420.0" width="230.0" height="130.0" rx="16" fill="#EBF1F5" stroke="#356482" stroke-width="2.4" />
    <text x="1125.0" y="475.9" text-anchor="middle" font-size="26" font-weight="700" fill="#23475E">Decoder</text>
    <text x="1125.0" y="516.2" text-anchor="middle" font-size="21" fill="#33434A">p(x | z<tspan baseline-shift="sub" font-size="18">q</tspan>)</text><line x1="1240.0" y1="485.0" x2="1298.0" y2="485.0" stroke="#356482" stroke-width="3.4" stroke-linecap="round" /><polygon points="1310.0,485.0 1294.0,492.0 1294.0,478.0" fill="#356482" /><rect x="1315.0" y="420.0" width="210.0" height="130.0" rx="16" fill="#F3EEE3" stroke="#7A7367" stroke-width="2.4" />
    <text x="1420.0" y="475.9" text-anchor="middle" font-size="26" font-weight="700" fill="#1F2A2E">Output x̂</text>
    <text x="1420.0" y="516.2" text-anchor="middle" font-size="21" fill="#5A554E">Reconstruction</text><line x1="760.0" y1="300.0" x2="760.0" y2="403.0" stroke="#4B6B46" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="9 7" /><polygon points="760.0,415.0 753.0,399.0 767.0,399.0" fill="#4B6B46" /><line x1="840.0" y1="415.0" x2="840.0" y2="317.0" stroke="#4B6B46" stroke-width="3.4" stroke-linecap="round" /><polygon points="840.0,305.0 847.0,321.0 833.0,321.0" fill="#4B6B46" /><text x="862" y="366" font-size="22" font-weight="700" fill="#4B6B46">Codebook loss</text><path d="M 700 420 C 665 340, 540 340, 510 410" fill="none" stroke="#4B6B46" stroke-width="3.2" /><polygon points="507.0,419.0 504.9,401.7 518.3,405.7" fill="#4B6B46" /><text x="515" y="342" text-anchor="middle" font-size="22" font-weight="700" fill="#4B6B46">Commitment loss</text><path d="M 970 500 C 970 690, 625 690, 625 512" fill="none" stroke="#B5493A" stroke-width="4.2" /><polygon points="625.0,502.0 633.0,520.0 617.0,520.0" fill="#B5493A" /><text x="800" y="705" text-anchor="middle" font-size="25" font-weight="700" fill="#B5493A">Straight-through copy: ∂L<tspan baseline-shift="sub" font-size="18">rec</tspan>/∂z<tspan baseline-shift="sub" font-size="18">e</tspan> ← ∂L<tspan baseline-shift="sub" font-size="18">rec</tspan>/∂z<tspan baseline-shift="sub" font-size="18">q</tspan></text><text x="800" y="746" text-anchor="middle" font-size="22" fill="#6B655B">Bypasses zero gradient of discrete argmin lookup</text>
  </g>
</svg>

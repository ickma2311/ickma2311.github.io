   <g id="text_1">
    <text style="fill: #24312e; font: 700 28px 'DejaVu Sans'; text-anchor: start" x="50.4" y="46.8" transform="rotate(-0 50.4 46.8)">14 GB of weights becomes an 84 GB training-state subtotal</text>
   </g>
   <g id="text_2">
    <text style="fill: #52635d; font: 16px 'DejaVu Sans'; text-anchor: start" x="50.4" y="82.8" transform="rotate(-0 50.4 82.8)">Worked example: 7 billion parameters · BF16 weights and gradients · FP32 Adam moments</text>
   </g>
   <g id="text_3">
    <text style="fill: #24312e; font: 700 25px 'DejaVu Sans'; text-anchor: start" x="97.2" y="453.6" transform="rotate(-0 97.2 453.6)">2P + 2P + 4P + 4P = 12P bytes</text>
   </g>
   <g id="text_4">
    <text style="fill: #98533f; font: 20px 'DejaVu Sans'; text-anchor: start" x="97.2" y="507.6" transform="rotate(-0 97.2 507.6)">An additional FP32 master-weight copy would add 28 GB.</text>
   </g>
   <g id="text_5">
    <text style="fill: #24312e; font: 17px 'DejaVu Sans'; text-anchor: start" x="97.2" y="558" transform="rotate(-0 97.2 558)">Still excluded: activations, temporary workspaces, communication buffers, allocator overhead.</text>
   </g>
   <g id="text_6">
    <text style="fill: #52635d; font: 14px 'DejaVu Sans'; text-anchor: start" x="97.2" y="604.08" transform="rotate(-0 97.2 604.08)">This is one dtype configuration, not a universal PyTorch/AMP memory guarantee. No sharding is assumed in the bar.</text>
   </g>
  </g>

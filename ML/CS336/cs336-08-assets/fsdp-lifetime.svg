   <g id="text_2">
    <text style="fill: #283831; font: 15px 'DejaVu Sans'; text-anchor: start" x="150.3" y="136.332" transform="rotate(-0 150.3 136.332)">FSDP example: reshard after forward; gather again for backward</text>
   </g>
   <g id="text_3">
    <text style="fill: #283831; font: 700 14px 'DejaVu Sans'; text-anchor: middle" x="245.16" y="216.758518" transform="rotate(-0 245.16 216.758518)">1  All-gather</text>
   </g>

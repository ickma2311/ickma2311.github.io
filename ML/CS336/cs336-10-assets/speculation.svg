  <g id="text_36">
   <text style="fill: #253b4a; font: 700 24px 'DejaVu Sans'; text-anchor: start" x="51.84" y="38.88" transform="rotate(-0 51.84 38.88)">Speculative sampling corrects the draft’s excess mass</text>
  </g>
  <g id="text_37">
   <text style="fill: #253b4a; font: 17px 'DejaVu Sans'; text-anchor: start" x="51.84" y="68.04" transform="rotate(-0 51.84 68.04)">Constructed example · target q(A) = q(B) = 0.5</text>
  </g>
  <g id="text_38">
   <text style="fill: #253b4a; font: 17px 'DejaVu Sans'; text-anchor: start" x="51.84" y="408.24" transform="rotate(-0 51.84 408.24)">Accept A with probability 0.5 / 0.8 = 0.625; always accept B.</text>
  </g>
  <g id="text_39">
   <text style="fill: #253b4a; font: 17px 'DejaVu Sans'; text-anchor: start" x="51.84" y="442.26" transform="rotate(-0 51.84 442.26)">Rejection probability = 0.3. The residual distribution assigns all of it to B.</text>
  </g>
  <g id="text_40">
   <text style="fill: #253b4a; font: 14px 'DejaVu Sans'; text-anchor: start" x="51.84" y="468.99" transform="rotate(-0 51.84 468.99)">Accepted mass + corrected residual = target distribution. This is not a speed measurement.</text>
  </g>

   <g id="text_1">
    <text style="font-weight: 700; font-size: 30px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #302e2a" x="46.8" y="46.8" transform="rotate(-0 46.8 46.8)">Test-time search ≠ test-time learning</text>
   </g>
   <g id="text_2">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #355f79" x="46.8" y="82.8" transform="rotate(-0 46.8 82.8)">Fixed weights explore more paths; test-time RL changes the prover checkpoint.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #355f79" x="62.64" y="174.277031" transform="rotate(-0 62.64 174.277031)">SEARCH ONLY</text>
   </g>
   <g id="text_4">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(62.64 211.050156)">Generalist checkpoint θ</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(62.64 235.253375)">Try more tactic sequences on the target.</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(62.64 259.669094)">θ stays fixed during this search.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526746" x="606.24" y="174.277031" transform="rotate(-0 606.24 174.277031)">TEST-TIME RL</text>
   </g>
   <g id="text_6">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(606.24 211.050156)">Start from the generalist checkpoint θ.</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(606.24 235.253375)">Generate related problem variants.</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(606.24 259.456594)">Use verified successes to train.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #355f79" x="62.64" y="426.277031" transform="rotate(-0 62.64 426.277031)">TARGET</text>
   </g>

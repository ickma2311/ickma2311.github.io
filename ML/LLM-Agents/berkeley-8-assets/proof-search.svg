   <g id="text_1">
    <text style="font-weight: 700; font-size: 30px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #302e2a" x="46.8" y="46.8" transform="rotate(-0 46.8 46.8)">A plausible step is not a proof</text>
   </g>
   <g id="text_2">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #355f79" x="46.8" y="82.8" transform="rotate(-0 46.8 82.8)">Berkeley Agents · Lecture 8 · AlphaProof | Constructed arithmetic illustration</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #355f79" x="62.64" y="163.477031" transform="rotate(-0 62.64 163.477031)">GOAL: find a prime greater than 5</text>
   </g>
   <g id="text_4">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(62.64 200.117344)">Choose p such that p &gt; 5 and Prime(p).</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(62.64 224.320563)">Euclid construction: N = 5! + 1 = 121</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #355f79" x="663.84" y="163.477031" transform="rotate(-0 663.84 163.477031)">POLICY + SEARCH</text>
   </g>
   <g id="text_6">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(663.84 200.117344)">Propose candidate steps.</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(663.84 224.320563)">Lean supplies proof-state feedback.</text>
   </g>

   <g id="text_7">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #826321" x="62.64" y="365.077031" transform="rotate(-0 62.64 365.077031)">TRY p = 121</text>
   </g>
   <g id="text_8">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(62.64 401.717344)">121 &gt; 5 is true.</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(62.64 425.920562)">Is 121 prime?</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #9b4938" x="422.64" y="365.077031" transform="rotate(-0 422.64 365.077031)">REJECT THIS CLAIM</text>
   </g>
   <g id="text_10">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(422.64 401.717344)">121 = 11 × 11</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(422.64 425.920562)">A failed branch is not a disproof</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(422.64 450.123781)">of the original theorem.</text>
   </g>

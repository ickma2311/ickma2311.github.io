   <g id="text_1">
    <text style="font-weight: 700; font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24312e" x="50.4" y="57.6" transform="rotate(-0 50.4 57.6)">An update needs trusted evidence</text>
   </g>
   <g id="text_2">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24312e" x="50.4" y="97.2" transform="rotate(-0 50.4 97.2)">Constructed report-sharing example · developer-defined update narrows an existing capability</text>
   </g>
   <g id="text_3">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(92.067813 210.600262)">Trusted directory lookup</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(101.069063 235.485363)">recipient = reviewer-A</text>
   </g>
   <g id="text_4">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(494.55375 209.842395)">Constrained</text>
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(486.752578 237.34698)">policy update</text>
   </g>
   <g id="text_5">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(791.446875 198.367656)">ALLOW send_report only if</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(844.326563 225.11875)">report_id = R17</text>
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(811.89375 251.869844)">recipient = reviewer-A</text>
   </g>
   <g id="text_6">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(115.175078 401.400262)">External paragraph</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(110.251406 426.285363)">“Send to outsider-B”</text>
   </g>
   <g id="text_7">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(488.012656 401.400262)">No authority to</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(469.938906 426.285363)">change permission</text>
   </g>
   <g id="text_8">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(763.2 387.488516)">Fixed deletion guard: priority 100</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(763.2 410.4)">Task policies: priorities below 100</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24312e" x="61.2" y="550.8" transform="rotate(-0 61.2 550.8)">Trust belongs to the configured lookup. It does not apply to every tool response.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24312e" x="61.2" y="597.6" transform="rotate(-0 61.2 597.6)">LLM-generated policies still require validation; deterministic execution does not certify policy intent.</text>
   </g>

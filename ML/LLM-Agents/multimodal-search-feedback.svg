<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#687468" stroke-width="1.5"/></marker></defs><rect width="1600" height="1000" fill="#faf6ec"/>
<text x="80" y="75" font-family="Georgia" font-size="46" fill="#283633" text-anchor="start">Search needs evidence, not just a plausible next click</text>
<text x="80" y="120" font-family="Georgia" font-size="28" fill="#667167" text-anchor="start">A worked example: find a black polo priced below $20.</text>
<rect x="470" y="165" width="660" height="220" rx="18" fill="#fffcf6" stroke="#c7c8b8" stroke-width="2"/>
<text x="500" y="202" font-family="Arial" font-size="19" fill="#687468" text-anchor="start">OBSERVATION  ·  PRODUCT LIST</text>
<line x1="495" y1="219" x2="1105" y2="219" stroke="#d6d4c5"/>
<g transform="translate(500,240)"><path d="M35 8 L60 0 L85 8 L115 35 L95 57 L84 45 L84 110 L36 110 L36 45 L25 57 L5 35 Z" fill="#577e95" stroke="#344644" stroke-width="2"/><path d="M47 4 L60 24 L73 4 M60 24 L60 47" fill="none" stroke="#e5e4d9" stroke-width="2"/><circle cx="64" cy="31" r="1.5" fill="#e5e4d9"/></g>
<text x="635" y="280" font-family="Georgia" font-size="28" fill="#283633" text-anchor="start">Blue polo</text>
<text x="635" y="321" font-family="Georgia" font-size="30" fill="#283633" text-anchor="start">$18</text>
<g transform="translate(805,240)"><path d="M35 8 L60 0 L85 8 L115 35 L95 57 L84 45 L84 110 L36 110 L36 45 L25 57 L5 35 Z" fill="#343d3a" stroke="#344644" stroke-width="2"/><path d="M47 4 L60 24 L73 4 M60 24 L60 47" fill="none" stroke="#e5e4d9" stroke-width="2"/><circle cx="64" cy="31" r="1.5" fill="#e5e4d9"/></g>
<text x="940" y="280" font-family="Georgia" font-size="28" fill="#283633" text-anchor="start">Black polo</text>
<text x="940" y="321" font-family="Georgia" font-size="30" fill="#283633" text-anchor="start">$19</text>
<path d="M660 386 C660 428 440 420 440 467" fill="none" stroke="#687468" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M940 386 C940 428 1160 420 1160 467" fill="none" stroke="#687468" stroke-width="3" marker-end="url(#arrow)"/>
<text x="410" y="435" font-family="Arial" font-size="21" fill="#647c8c" text-anchor="middle">Open candidate A</text>
<text x="1190" y="435" font-family="Arial" font-size="21" fill="#54755a" text-anchor="middle">Open candidate B</text>
<rect x="140" y="480" width="560" height="260" rx="18" fill="#fffcf6" stroke="#c7c8b8" stroke-width="2"/>
<g transform="translate(165,535)"><path d="M35 8 L60 0 L85 8 L115 35 L95 57 L84 45 L84 110 L36 110 L36 45 L25 57 L5 35 Z" fill="#577e95" stroke="#344644" stroke-width="2"/><path d="M47 4 L60 24 L73 4 M60 24 L60 47" fill="none" stroke="#e5e4d9" stroke-width="2"/><circle cx="64" cy="31" r="1.5" fill="#e5e4d9"/></g>
<text x="320" y="525" font-family="Georgia" font-size="30" fill="#283633" text-anchor="start">A · Blue polo</text>
<text x="320" y="570" font-family="Georgia" font-size="25" fill="#283633" text-anchor="start">Price: $18 &lt; $20</text>
<text x="320" y="613" font-family="Georgia" font-size="25" fill="#283633" text-anchor="start">Color: blue ≠ black</text>
<rect x="315" y="641" width="345" height="62" rx="8" fill="#f4e4d8" stroke="none" stroke-width="2"/>
<text x="335" y="681" font-family="Arial" font-size="23" fill="#975c47" text-anchor="start">Reject: wrong color</text>
<rect x="900" y="480" width="560" height="260" rx="18" fill="#fffcf6" stroke="#c7c8b8" stroke-width="2"/>
<g transform="translate(925,535)"><path d="M35 8 L60 0 L85 8 L115 35 L95 57 L84 45 L84 110 L36 110 L36 45 L25 57 L5 35 Z" fill="#343d3a" stroke="#344644" stroke-width="2"/><path d="M47 4 L60 24 L73 4 M60 24 L60 47" fill="none" stroke="#e5e4d9" stroke-width="2"/><circle cx="64" cy="31" r="1.5" fill="#e5e4d9"/></g>
<text x="1080" y="525" font-family="Georgia" font-size="30" fill="#283633" text-anchor="start">B · Black polo</text>
<text x="1080" y="570" font-family="Georgia" font-size="25" fill="#283633" text-anchor="start">Price: $19 &lt; $20</text>
<text x="1080" y="613" font-family="Georgia" font-size="25" fill="#283633" text-anchor="start">Color: black = black</text>
<rect x="1075" y="641" width="345" height="62" rx="8" fill="#e8eddf" stroke="none" stroke-width="2"/>
<text x="1095" y="681" font-family="Arial" font-size="23" fill="#42634b" text-anchor="start">Matches both constraints</text>
<path d="M140 610 C45 610 50 275 467 275" fill="none" stroke="#a66d50" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="10 9"/>
<text x="200" y="370" font-family="Georgia" font-size="23" fill="#975c47" text-anchor="start">Backtrack</text>
<text x="200" y="397" font-family="Georgia" font-size="19" fill="#975c47" text-anchor="start">and try another branch</text>
<path d="M1180 741 L1180 788" fill="none" stroke="#687468" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="900" y="800" width="560" height="70" rx="12" fill="#e8eddf" stroke="#b5c0a9" stroke-width="2"/>
<text x="1180" y="844" font-family="Arial" font-size="23" fill="#283633" text-anchor="middle">Return the matching product and its link</text>
<text x="140" y="804" font-family="Georgia" font-size="27" fill="#283633" text-anchor="start">Policy: propose what to try.</text>
<text x="140" y="847" font-family="Georgia" font-size="27" fill="#283633" text-anchor="start">Evaluator: judge what happened.</text>
<line x1="80" y1="907" x2="1520" y2="907" stroke="#c7c8b8"/>
<text x="80" y="951" font-family="Georgia" font-size="24" fill="#667167" text-anchor="start">Illustrative task, not a benchmark result. Evaluator scores can be wrong; check the actual outcome.</text>
</svg>
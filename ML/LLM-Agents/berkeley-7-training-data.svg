   <g id="text_11">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #466a50" x="66.24" y="449.9175" transform="rotate(-0 66.24 449.9175)">Image question</text>

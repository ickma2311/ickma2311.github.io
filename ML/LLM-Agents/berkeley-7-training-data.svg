   <g id="text_1">
    <text style="font-weight: 700; font-size: 29px; font-family: 'DejaVu Serif'; text-anchor: start; fill: #283a40" x="46.8" y="50.835469" transform="rotate(-0 46.8 50.835469)">Useful training data needs more than a plausible answer</text>
   </g>
   <g id="text_2">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #3c657c" x="46.8" y="84.837656" transform="rotate(-0 46.8 84.837656)">Two distinct uses of synthetic actions · AgentTrek and TACO</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Serif'; text-anchor: start; fill: #283a40" x="50.4" y="135.516563" transform="rotate(-0 50.4 135.516563)">AgentTrek: turn a tutorial into an executed trajectory</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #3c657c" x="66.24" y="189.2775" transform="rotate(-0 66.24 189.2775)">1  Structure the tutorial</text>
   </g>
   <g id="text_5">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #283a40" transform="translate(66.24 231.0375)">Goal: export a chart as PNG</text>
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #283a40" transform="translate(66.24 254.424875)">App version + prerequisites</text>
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #283a40" transform="translate(66.24 277.81225)">Steps + expected output</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #3c657c" x="437.04" y="189.2775" transform="rotate(-0 437.04 189.2775)">2  Replay in an environment</text>
   </g>
   <g id="text_7">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #283a40" transform="translate(437.04 231.0375)">Observe: chart editor</text>
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #283a40" transform="translate(437.04 254.424875)">Action: choose PNG, export</text>
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #283a40" transform="translate(437.04 277.81225)">Record screens and actions</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #3c657c" x="807.84" y="189.2775" transform="rotate(-0 807.84 189.2775)">3  Filter before training</text>
   </g>
   <g id="text_9">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #283a40" transform="translate(807.84 231.0375)">Inspect trajectory + outcome</text>
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #283a40" transform="translate(807.84 254.424875)">Keep supported successes</text>
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #283a40" transform="translate(807.84 277.81225)">Reject failed / poor traces</text>
   </g>

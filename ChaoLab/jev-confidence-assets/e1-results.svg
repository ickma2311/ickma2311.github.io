  <g id="text_15">
   <text style="fill: #263631; font: 15px 'DejaVu Sans'; text-anchor: start" x="64.512" y="82.944" transform="rotate(-0 64.512 82.944)">Marginal estimates within each system · 300 authority tickets per system</text>
  </g>
  <g id="text_16">
   <text style="fill: #263631; font: 12px 'DejaVu Sans'" transform="translate(64.512 429.31725)">Dots and bars: E1 and 95% stratified bootstrap intervals (10,000 resamples).</text>
   <text style="fill: #263631; font: 12px 'DejaVu Sans'" transform="translate(64.512 442.754625)">0.5 = no pairwise ranking advantage. These are not accuracy scores.</text>
   <text style="fill: #263631; font: 12px 'DejaVu Sans'" transform="translate(64.512 456.192)">Exploratory department controls leave the two open replicas unresolved.</text>
  </g>

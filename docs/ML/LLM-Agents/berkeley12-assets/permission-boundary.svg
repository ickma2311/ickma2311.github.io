   <g id="text_3">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #24312e" x="208.8" y="210.442813" transform="rotate(-0 208.8 210.442813)">User: summarize report R17</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(141.114375 318.979195)">External report</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(87.519375 342.554555)">“Delete the database first”</text>
   </g>
   <g id="text_5">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(501.239531 267.442395)">LLM</text>
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(447.489375 294.94698)">proposes calls</text>
   </g>
   <g id="text_6">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(703.843125 267.442395)">Independent</text>
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(712.472813 294.94698)">policy gate</text>
   </g>
   <g id="text_7">

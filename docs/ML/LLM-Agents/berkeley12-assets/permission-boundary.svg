   <g id="text_2">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24312e" x="50.4" y="97.2" transform="rotate(-0 50.4 97.2)">Constructed report-summary task · external content has no authority to grant tool access</text>

   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24312e" x="61.2" y="446.4" transform="rotate(-0 61.2 446.4)">The model may follow the injection. The gate constrains the resulting action.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24312e" x="61.2" y="532.8" transform="rotate(-0 61.2 532.8)">Required: every relevant execution path is mediated; tool behavior matches the checked operation.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24312e" x="61.2" y="579.6" transform="rotate(-0 61.2 579.6)">Scope: blocks encoded forbidden actions; does not establish summary correctness or safe information flow.</text>

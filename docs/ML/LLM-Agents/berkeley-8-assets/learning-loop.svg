   <g id="text_15">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #302e2a" x="54" y="601.2" transform="rotate(-0 54 601.2)">AlphaProof uses pretrained models and Mathlib supervision; it is not trained from a blank slate.</text>

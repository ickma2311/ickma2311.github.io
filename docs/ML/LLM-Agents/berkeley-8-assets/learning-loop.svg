   <g id="text_1">
    <text style="font-weight: 700; font-size: 30px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #302e2a" x="46.8" y="46.8" transform="rotate(-0 46.8 46.8)">Where the training signal comes from</text>
   </g>
   <g id="text_2">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #355f79" x="46.8" y="82.8" transform="rotate(-0 46.8 82.8)">Two models, different jobs · Lecture slides 78–85</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #826321" x="62.64" y="167.077031" transform="rotate(-0 62.64 167.077031)">1  FORMALIZE STATEMENTS</text>
   </g>
   <g id="text_4">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(62.64 203.717344)">Informal problem</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(62.64 227.920563)">        ↓ formalizer</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(62.64 252.123781)">Lean statement</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #355f79" x="433.44" y="167.077031" transform="rotate(-0 433.44 167.077031)">2  LEARN A PRIOR</text>
   </g>
   <g id="text_6">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(433.44 203.717344)">Mathlib proof states</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(433.44 227.920563)">        ↓ supervision</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(433.44 252.123781)">Proposed Lean tactics</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526746" x="804.24" y="167.077031" transform="rotate(-0 804.24 167.077031)">3  SEARCH + VERIFY</text>
   </g>
   <g id="text_8">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(804.24 203.717344)">Try tactics in Lean</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(804.24 227.920563)">        ↓ close all goals</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(804.24 252.123781)">Checked proof</text>
   </g>

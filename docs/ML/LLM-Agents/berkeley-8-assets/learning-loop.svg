   <g id="text_9">
    <text style="font-size: 26px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #355f79" x="385.2" y="216" transform="rotate(-0 385.2 216)">+</text>
   </g>
   <g id="text_10">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #302e2a" x="57.6" y="338.4" transform="rotate(-0 57.6 338.4)">Formal statements define the search tasks; Mathlib supervision initializes the prover.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #9b4938" x="62.64" y="408.277031" transform="rotate(-0 62.64 408.277031)">TWO DIFFERENT CHECKS</text>
   </g>
   <g id="text_12">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(62.64 444.917344)">Does Lean accept the formal proof?</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(62.64 469.120563)">Does the statement match the intended problem?</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(62.64 493.323781)">The first does not guarantee the second.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526746" x="606.24" y="408.277031" transform="rotate(-0 606.24 408.277031)">4  REINFORCE THE PROVER</text>
   </g>
   <g id="text_14">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(606.24 444.917344)">Use verified search experience for RL.</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(606.24 469.120563)">Better proposals guide later searches.</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #302e2a" transform="translate(606.24 493.323781)">The verifier is not the learned policy.</text>
   </g>

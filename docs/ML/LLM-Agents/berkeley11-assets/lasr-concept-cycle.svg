   <g id="text_1">
    <text style="fill: #24312e; font: 700 28px 'DejaVu Sans'; text-anchor: start" x="63.36" y="45.36" transform="rotate(-0 63.36 45.36)">LaSR evolves expressions and their abstractions</text>
   </g>
   <g id="text_2">
    <text style="fill: #52635d; font: 18px 'DejaVu Sans'; text-anchor: start" x="63.36" y="84.24" transform="rotate(-0 63.36 84.24)">Concepts bias proposals; execution on data and expression complexity still select candidates.</text>
   </g>
   <g id="text_3">
    <text style="fill: #3c665b; font: 700 23px 'DejaVu Sans'; text-anchor: start" x="86.4" y="181.44" transform="rotate(-0 86.4 181.44)">1  Hypothesis evolution</text>
   </g>
   <g id="text_4">
    <!-- $a x^k\quad a e^{bx}\quad a\sin(bx)+c$ -->
    <g style="fill: #24312e" transform="translate(86.4 223.56)">
     <text>
      <tspan style="font: italic 26px 'DejaVu Serif'" x="0 15.500977 67.624277 83.125254 146.90873 210.956582 227.600137 284.053652" y="-0.7250000000000014">axaeabxc</tspan>
      <tspan style="font: italic 18.2px 'DejaVu Serif'" x="31.266562 99.664785 111.315273" y="-10.175">kbx</tspan>
      <tspan style="font: 26px 'DejaVu Serif'" x="162.409707 175.75248 184.06791 200.813027 242.263223 257.337637" y="-0.7250000000000014">sin()+</tspan>
     </text>
    </g>
   </g>
   <g id="text_5">
    <text style="fill: #24312e; font: 18px 'DejaVu Sans'" transform="translate(86.4 251.140781)">Mix symbolic edits with LLM-guided edits.</text>
    <text style="fill: #24312e; font: 18px 'DejaVu Sans'" transform="translate(86.4 275.4)">Evaluate data fit and simplicity.</text>
   </g>
   <g id="text_6">
    <text style="fill: #98533f; font: 700 21px 'DejaVu Sans'; text-anchor: start" x="673.92" y="181.44" transform="rotate(-0 673.92 181.44)">2  Concept abstraction</text>
   </g>
   <g id="text_7">
    <text style="fill: #24312e; font: 23px 'DejaVu Serif'; text-anchor: start" x="673.92" y="226.8" transform="rotate(-0 673.92 226.8)">“power law”    “periodic”</text>
   </g>
   <g id="text_8">
    <text style="fill: #24312e; font: 18px 'DejaVu Sans'" transform="translate(673.92 251.140781)">Summarize patterns in better expressions</text>
    <text style="fill: #24312e; font: 18px 'DejaVu Sans'" transform="translate(673.92 275.4)">and avoid patterns in poor ones.</text>
   </g>
   <g id="text_9">
    <text style="fill: #876526; font: 700 23px 'DejaVu Sans'; text-anchor: start" x="385.92" y="430.92" transform="rotate(-0 385.92 430.92)">3  Concept evolution</text>
   </g>
   <g id="text_10">
    <text style="fill: #24312e; font: 18px 'DejaVu Sans'; text-anchor: start" x="385.92" y="469.8" transform="rotate(-0 385.92 469.8)">Combine and extend reusable concepts.</text>
   </g>
   <g id="text_11">
    <text style="fill: #24312e; font: 18px 'DejaVu Sans'; text-anchor: start" x="385.92" y="505.44" transform="rotate(-0 385.92 505.44)">Library guides the next search round.</text>
   </g>
   <g id="text_12">
    <text style="fill: #24312e; font: 700 18px 'DejaVu Sans'; text-anchor: start" x="63.36" y="586.44" transform="rotate(-0 63.36 586.44)">A concept is guidance, not a certified law. A low-loss expression is an empirical candidate.</text>
   </g>
   <g id="text_13">
    <text style="fill: #52635d; font: 14px 'DejaVu Sans'; text-anchor: start" x="63.36" y="622.08" transform="rotate(-0 63.36 622.08)">Schematic of the published three-phase method. Expression families are illustrations, not benchmark outputs.</text>
   </g>
  </g>

   <g id="text_1">
    <text style="fill: #24312e; font: 700 29px 'DejaVu Sans'; text-anchor: start" x="50.4" y="54" transform="rotate(-0 50.4 54)">Shorter sequences and larger vocabularies have different costs</text>
   </g>
   <g id="text_2">
    <text style="fill: #52635d; font: 16px 'DejaVu Sans'; text-anchor: start" x="50.4" y="95.04" transform="rotate(-0 50.4 95.04)">Illustrative accounting for the same 1,000 bytes; no measured runtime or tokenizer benchmark</text>
   </g>
   <g id="text_3">
    <text style="fill: #24312e; font: 700 22px 'DejaVu Sans'; text-anchor: start" x="79.2" y="187.2" transform="rotate(-0 79.2 187.2)">Sequence side: full attention</text>
   </g>
   <g id="text_4">
    <text style="fill: #24312e; font: 21px 'DejaVu Sans'; text-anchor: start" x="79.2" y="233.28" transform="rotate(-0 79.2 233.28)">1 byte/token:       n = 1,000</text>
   </g>
   <g id="text_5">
    <text style="fill: #24312e; font: 21px 'DejaVu Sans'; text-anchor: start" x="79.2" y="275.04" transform="rotate(-0 79.2 275.04)">4 bytes/token:     n = 250</text>
   </g>
   <g id="text_6">
    <text style="fill: #98533f; font: 21px 'DejaVu Sans'; text-anchor: start" x="79.2" y="326.16" transform="rotate(-0 79.2 326.16)">n²: 1,000,000 → 62,500 entries</text>
   </g>
   <g id="text_7">
    <text style="fill: #24312e; font: 700 22px 'DejaVu Sans'; text-anchor: start" x="620.64" y="187.2" transform="rotate(-0 620.64 187.2)">Vocabulary side</text>
   </g>
   <g id="text_8">
    <text style="fill: #24312e; font: 23px 'DejaVu Sans'; text-anchor: start" x="620.64" y="233.28" transform="rotate(-0 620.64 233.28)">Embedding table: V × d</text>
   </g>
   <g id="text_9">
    <text style="fill: #24312e; font: 21px 'DejaVu Sans'; text-anchor: start" x="620.64" y="279.36" transform="rotate(-0 620.64 279.36)">Next-token scores: V choices</text>
   </g>
   <g id="text_10">
    <text style="fill: #3c665b; font: 20px 'DejaVu Sans'; text-anchor: start" x="620.64" y="325.44" transform="rotate(-0 620.64 325.44)">More symbols also have a cost.</text>
   </g>
   <g id="text_11">
    <text style="fill: #24312e; font: 700 24px 'DejaVu Sans'; text-anchor: start" x="68.4" y="439.2" transform="rotate(-0 68.4 439.2)">16× fewer full-attention score entries ≠ 16× faster model</text>
   </g>
   <g id="text_12">
    <text style="fill: #24312e; font: 18px 'DejaVu Sans'; text-anchor: start" x="68.4" y="488.16" transform="rotate(-0 68.4 488.16)">Other layers, output scores, memory traffic and hardware still contribute.</text>
   </g>
   <g id="text_13">
    <text style="fill: #24312e; font: 18px 'DejaVu Sans'; text-anchor: start" x="68.4" y="530.64" transform="rotate(-0 68.4 530.64)">Efficient attention kernels need not store the entire n × n score matrix.</text>
   </g>
   <g id="text_14">
    <text style="fill: #52635d; font: 15px 'DejaVu Sans'; text-anchor: start" x="68.4" y="594" transform="rotate(-0 68.4 594)">V = vocabulary size; d = embedding width; n = token count. Bytes/token measures sequence length.</text>
   </g>
  </g>
 </g>

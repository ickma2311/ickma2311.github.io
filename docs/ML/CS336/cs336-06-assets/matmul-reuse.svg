    <dc:title>matmul-reuse</dc:title>
    <dc:date>2026-10-18T08:10:13.951308</dc:date>
    <dc:description>Constructed 64x64x32 tile with four-byte inputs: 262144 FLOPs, 16384 input bytes, 16 FLOP per byte excluding output. Accumulator FP32 logical state is 16384 bytes, with no fixed physical storage claim.</dc:description>

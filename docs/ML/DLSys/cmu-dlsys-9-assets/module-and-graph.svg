   <g id="text_19">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52635d" x="57.6" y="608.4" transform="rotate(-0 57.6 608.4)">Containment finds parameters. Tensor operations carry gradients. The update changes stored parameter values.</text>

   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Serif'; text-anchor: middle; fill: #24303a" x="486" y="46.238468" transform="rotate(-0 486 46.238468)">Inverted dropout preserves activations in expectation</text>
   </g>
   <g id="text_2">
    <text style="font-size: 13px; font-family: 'DejaVu Serif'; text-anchor: middle; fill: #6d706b" x="486" y="65.660163" transform="rotate(-0 486 65.660163)">Constructed example: drop probability p = 0.5</text>
   </g>
   <g id="text_3">
    <text style="font-size: 15px; font-family: 'DejaVu Serif'; fill: #24303a" transform="translate(116.968286 200.389084)">pre-dropout</text>
    <text style="font-size: 15px; font-family: 'DejaVu Serif'; fill: #24303a" transform="translate(101.860473 218.993186)">ẑ = [2, −1, 3, 4]</text>
   </g>
   <g id="text_4">
    <text style="font-size: 15px; font-family: 'DejaVu Serif'; fill: #24303a" transform="translate(407.616809 200.689084)">sampled mask</text>
    <text style="font-size: 15px; font-family: 'DejaVu Serif'; fill: #24303a" transform="translate(404.444543 218.693186)">m = [1, 0, 1, 0]</text>
   </g>
   <g id="text_5">
    <text style="font-size: 14px; font-family: 'DejaVu Serif'; fill: #24303a" transform="translate(731.588289 192.346955)">training output</text>
    <text style="font-size: 14px; font-family: 'DejaVu Serif'; fill: #24303a" transform="translate(723.745007 209.710784)">z = m ⊙ ẑ / (1−p)</text>
    <text style="font-size: 14px; font-family: 'DejaVu Serif'; fill: #24303a" transform="translate(736.294695 226.514612)">  = [4, 0, 6, 0]</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Serif'; text-anchor: middle; fill: #a94732" x="196.200144" y="325.247962" transform="rotate(-0 196.200144 325.247962)">One mask is noisy</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11.5px; font-family: 'DejaVu Serif'; text-anchor: middle; fill: #6d706b" x="196.200144" y="355.805935" transform="rotate(-0 196.200144 355.805935)">This particular draw does not equal ẑ.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 15px; font-family: 'DejaVu Serif'; fill: #24303a" transform="translate(433.901953 350.400955)">E[mⱼ] = 1 − p</text>
    <text style="font-size: 15px; font-family: 'DejaVu Serif'; fill: #24303a" transform="translate(413.656641 369.005056)">E[mⱼ ẑⱼ /(1−p)] = ẑⱼ</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Serif'; text-anchor: middle; fill: #4e7158" x="775.799856" y="325.247962" transform="rotate(-0 775.799856 325.247962)">The expectation is unchanged</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11.5px; font-family: 'DejaVu Serif'; text-anchor: middle; fill: #6d706b" x="775.799856" y="355.805935" transform="rotate(-0 775.799856 355.805935)">The scaling prevents systematic shrinkage.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 15px; font-family: 'DejaVu Serif'; fill: #24303a" transform="translate(402.8625 478.188844)">inference: dropout off</text>
    <text style="font-size: 15px; font-family: 'DejaVu Serif'; fill: #24303a" transform="translate(467.044922 496.792946)">z = ẑ</text>
   </g>
   <g id="text_12">
    <text style="font-style: italic; font-size: 12.5px; font-family: 'DejaVu Serif'; text-anchor: middle; fill: #24303a" x="486" y="544.709772" transform="rotate(-0 486 544.709772)">The randomness regularizes training; the 1/(1−p) factor aligns the expected train-time scale with inference.</text>
   </g>
  </g>

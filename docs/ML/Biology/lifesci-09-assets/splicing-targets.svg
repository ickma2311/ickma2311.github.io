<title id="figure-title">splicing targets</title>
<desc id="figure-desc">Where is a splice site? How often is an exon included? Schematic transcript structure and constructed molecule counts, no sequence shown. Transcript direction left to right. Exons A, B, C separated by introns. Donors at the right edges of A and B; acceptors at the left edges of B and C. Mature transcript ABC includes B: 60 molecules. Mature transcript AC skips B: 40 molecules. Inclusion fraction psi = 60 / (60 + 40) = 0.60. Site labels refer to sequence positions; inclusion fractions refer to transcripts.</desc>



<title id="figure-title">conditional mean</title>
<desc id="figure-desc">An optimal average can hide real differences. Constructed example: among samples with the same measured input x, hidden target values are 2 or 8 with equal probability 50%. The optimal squared-error prediction is the conditional mean E[Y given x] = 5. Minimum expected squared error = 9. Neither hidden outcome is 5. The predictor sees x, not the hidden target. The horizontal axis shows target value, from 0 to 10.</desc>



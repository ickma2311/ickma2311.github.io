   <g id="text_9">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24323a" x="68.4864" y="379.7928" transform="rotate(-0 68.4864 379.7928)">Upper bound on the chance of missing by at least 1 point</text>
   </g>
   <g id="text_10">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24323a" x="68.4864" y="419.538341" transform="rotate(-0 68.4864 419.538341)">n = 1,000</text>
   </g>
   <g id="text_11">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24323a" x="904.0896" y="418.74788" transform="rotate(-0 904.0896 418.74788)">≤ 100% (trivial)</text>
   </g>
   <g id="text_12">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24323a" x="68.4864" y="480.644741" transform="rotate(-0 68.4864 480.644741)">n = 10,000</text>
   </g>
   <g id="text_13">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24323a" x="419.6448" y="479.853616" transform="rotate(-0 419.6448 479.853616)">≤ 25%</text>
   </g>
   <g id="text_14">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24323a" x="68.4864" y="541.751141" transform="rotate(-0 68.4864 541.751141)">n = 50,000</text>
   </g>
   <g id="text_15">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24323a" x="290.45952" y="540.960016" transform="rotate(-0 290.45952 540.960016)">≤ 5%</text>
   </g>
   <g id="text_16">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #365f76" x="68.4864" y="597.6504" transform="rotate(-0 68.4864 597.6504)">A bound is sufficient, not necessary. Selection bias and dependence are outside this model.</text>
   </g>
  </g>

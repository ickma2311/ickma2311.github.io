   <g id="text_1">
    <text style="font-weight: 700; font-size: 28px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24323a" x="63.36" y="47.714025" transform="rotate(-0 63.36 47.714025)">How many independent responses make a 1-point error rare?</text>
   </g>
   <g id="text_2">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #365f76" x="63.36" y="74.2608" transform="rotate(-0 63.36 74.2608)">MIT 6.041 Lecture 19 · Bernoulli poll · exact Chebyshev guarantee, not a predicted error rate</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #365f76" x="94.1184" y="187.759275" transform="rotate(-0 94.1184 187.759275)">1  Model</text>
   </g>
   <g id="text_4">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #24323a" transform="translate(94.1184 227.995413)">Each answer is 0 or 1.</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #24323a" transform="translate(94.1184 250.148538)">True yes-fraction: f</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #24323a" transform="translate(94.1184 273.948538)">Independent random sample: n</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4c705c" x="442.7136" y="187.757713" transform="rotate(-0 442.7136 187.757713)">2  Average</text>
   </g>
   <g id="text_6">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #24323a" transform="translate(442.7136 226.348538)">Sample fraction: Mₙ</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #24323a" transform="translate(442.7136 250.795334)">E[Mₙ] = f</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #24323a" transform="translate(442.7136 274.595334)">Var(Mₙ) = f(1−f)/n ≤ 1/(4n)</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #aa5941" x="791.3088" y="187.759275" transform="rotate(-0 791.3088 187.759275)">3  Bound</text>
   </g>
   <g id="text_8">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #24323a" transform="translate(791.3088 226.149319)">P(|Mₙ−f| ≥ 0.01)</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #24323a" transform="translate(791.3088 250.786038)">≤ 1 / (4n × 0.01²)</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #24323a" transform="translate(791.3088 274.728147)">≤ 0.05 when n ≥ 50,000</text>
   </g>

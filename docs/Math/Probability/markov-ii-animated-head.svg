   <g id="text_1">
    <text style="fill: #806329; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="34.56" y="29.278125" transform="rotate(-0 34.56 29.278125)">MIT 6.041 PROBABILITY  /  LECTURE 17  /  MARKOV CHAINS II</text>
   </g>
   <g id="text_2">
    <text style="fill: #293a38; font: 700 27px 'DejaVu Serif'; text-anchor: start" x="34.56" y="75.235781" transform="rotate(-0 34.56 75.235781)">Probability moves. Its distribution settles.</text>
   </g>
   <g id="text_3">
    <text style="fill: #293a38; font: 16px 'DejaVu Sans'; text-anchor: start" x="34.56" y="99.2775" transform="rotate(-0 34.56 99.2775)">Split by transition probability, then add the incoming contributions.</text>
   </g>
   <g id="text_4">
    <text style="fill: #41657c; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="39.6" y="135.838125" transform="rotate(-0 39.6 135.838125)">CURRENT DISTRIBUTION</text>
   </g>
   <g id="text_5">
    <text style="fill: #293a38; font: 18px 'DejaVu Sans'; text-anchor: start" x="39.6" y="161.277188" transform="rotate(-0 39.6 161.277188)">n = 8     μₙ = (0.286, 0.714)</text>
   </g>
   <g id="text_6">
    <text style="fill: #806329; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="306.72" y="135.838125" transform="rotate(-0 306.72 135.838125)">ONE STEP: SPLIT → TRANSFER → SUM</text>
   </g>
   <g id="text_7">
    <text style="fill: #994b36; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="698.4" y="135.838125" transform="rotate(-0 698.4 135.838125)">NEXT DISTRIBUTION</text>
   </g>
   <g id="text_8">
    <text style="fill: #293a38; font: 18px 'DejaVu Sans'; text-anchor: start" x="698.4" y="161.277188" transform="rotate(-0 698.4 161.277188)">n = 9</text>
   </g>
   <g id="text_9">
    <text style="fill: #293a38; font: 700 14px 'DejaVu Sans'; text-anchor: start" x="39.6" y="198.557812" transform="rotate(-0 39.6 198.557812)">State 1</text>
   </g>
   <g id="text_10">
    <text style="fill: #41657c; font: 14px 'DejaVu Sans'; text-anchor: start" x="39.6" y="244.637812" transform="rotate(-0 39.6 244.637812)">0.2858</text>
   </g>
   <g id="text_11">
    <text style="fill: #293a38; font: 700 14px 'DejaVu Sans'; text-anchor: start" x="39.6" y="284.957812" transform="rotate(-0 39.6 284.957812)">State 2</text>
   </g>
   <g id="text_12">
    <text style="fill: #994b36; font: 14px 'DejaVu Sans'; text-anchor: start" x="39.6" y="331.037812" transform="rotate(-0 39.6 331.037812)">0.7142</text>
   </g>
   <g id="text_13">
    <text style="fill: #293a38; font: 700 14px 'DejaVu Sans'; text-anchor: start" x="698.4" y="198.557812" transform="rotate(-0 698.4 198.557812)">State 1</text>
   </g>
   <g id="text_14">
    <text style="fill: #41657c; font: 14px 'DejaVu Sans'; text-anchor: start" x="698.4" y="244.637812" transform="rotate(-0 698.4 244.637812)">0.2857</text>
   </g>
   <g id="text_15">
    <text style="fill: #293a38; font: 700 14px 'DejaVu Sans'; text-anchor: start" x="698.4" y="284.957812" transform="rotate(-0 698.4 284.957812)">State 2</text>
   </g>
   <g id="text_16">
    <text style="fill: #994b36; font: 14px 'DejaVu Sans'; text-anchor: start" x="698.4" y="331.037812" transform="rotate(-0 698.4 331.037812)">0.7143</text>
   </g>
   <g id="text_17">
    <text style="fill: #293a38; font: 11px 'DejaVu Sans'; text-anchor: start" x="39.6" y="353.238281" transform="rotate(-0 39.6 353.238281)">Bar width = probability (0 to 1)</text>
   </g>
   <g id="text_18">
    <text style="fill: #41657c; font: 14px 'DejaVu Sans'; text-anchor: start" x="310.32" y="197.837812" transform="rotate(-0 310.32 197.837812)">1 → 1     0.286 × 0.5 = 0.143</text>
   </g>
   <g id="text_19">
    <text style="fill: #41657c; font: 14px 'DejaVu Sans'; text-anchor: start" x="310.32" y="238.877813" transform="rotate(-0 310.32 238.877813)">1 → 2     0.286 × 0.5 = 0.143</text>
   </g>
   <g id="text_20">
    <text style="fill: #994b36; font: 14px 'DejaVu Sans'; text-anchor: start" x="310.32" y="279.917812" transform="rotate(-0 310.32 279.917812)">2 → 1     0.714 × 0.2 = 0.143</text>
   </g>
   <g id="text_21">
    <text style="fill: #994b36; font: 14px 'DejaVu Sans'; text-anchor: start" x="310.32" y="320.957812" transform="rotate(-0 310.32 320.957812)">2 → 2     0.714 × 0.8 = 0.571</text>
   </g>
   <g id="text_22">
    <text style="fill: #806329; font: 700 14px 'DejaVu Sans'; text-anchor: start" x="307.44" y="364.877813" transform="rotate(-0 307.44 364.877813)">3  Add arrivals: μₙ₊₁ = μₙP</text>
   </g>
   <g id="text_23">
    <text style="fill: #41657c; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="34.56" y="402.918281" transform="rotate(-0 34.56 402.918281)">REPEAT THE SAME UPDATE</text>
   </g>
   <g id="text_24">
    <text style="fill: #293a38; font: 10px 'DejaVu Sans'; text-anchor: start" x="38.16" y="493.598437" transform="rotate(-0 38.16 493.598437)">Step n</text>
   </g>
   <g id="text_25">
    <text style="fill: #994b36; font: 11px 'DejaVu Sans'; text-anchor: start" x="129.6" y="494.358281" transform="rotate(-0 129.6 494.358281)">P(state 2) → 5/7</text>
   </g>
   <g id="text_26">
    <text style="fill: #806329; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="391.68" y="405.798281" transform="rotate(-0 391.68 405.798281)">AT STATIONARITY</text>
   </g>
   <g id="text_27">
    <!-- $\pi=(2/7,\;5/7),\quad\pi P=\pi$ -->
    <g style="fill: #293a38" transform="translate(391.68 432.116719)">
     <text>
      <tspan style="font: italic 21px 'DejaVu Serif'" x="0 166.602551 180.404309 220.095129" y="-0.046875">ππPπ</tspan>
      <tspan style="font: 21px 'DejaVu Serif'" x="17.784375 39.362695 47.555566 60.916406 66.241602 79.602441 95.791809 109.152648 114.477844 127.838684 136.031555 198.516809" y="-0.046875">=(2/7,5/7),=</tspan>
     </text>
    </g>
   </g>
   <g id="text_28">
    <!-- $\frac{2}{7}\times0.5=\frac{5}{7}\times0.2=\frac{1}{7}$ -->
    <g style="fill: #293a38" transform="translate(391.68 465.84)">
     <text>
      <tspan style="font: 14.7px 'DejaVu Serif'" x="0 0 96.496436 96.496436 192.367871 192.367871" y="-10.0734375 7.207812499999999 -10.28125 7.207812499999999 -10.0734375 7.207812499999999">275717</tspan>
      <tspan style="font: 21px 'DejaVu Serif'" x="15.960205 37.538525 50.899365 57.574658 74.918115 112.456641 134.034961 147.395801 153.446094 170.789551" y="-0.8625000000000007">×0.5=×0.2=</tspan>
     </text>
     <rect x="0" y="-5.823438" width="9.352588" height="1.3125"/>
     <rect x="96.496436" y="-5.823438" width="9.352588" height="1.3125"/>
     <rect x="192.367871" y="-5.823438" width="9.352588" height="1.3125"/>
    </g>
   </g>
   <g id="text_29">
    <text style="fill: #293a38; font: 700 17px 'DejaVu Sans'" transform="translate(666 421.157344)">Equal cross-state flow.</text>
    <text style="fill: #293a38; font: 700 17px 'DejaVu Sans'" transform="translate(666 444.068828)">Unequal occupancy.</text>
   </g>
   <g id="text_30">
    <text style="fill: #293a38; font: 13px 'DejaVu Sans'; text-anchor: start" x="666" y="480.757969" transform="rotate(-0 666 480.757969)">State 2 is harder to leave.</text>
   </g>
   <g id="text_31">
    <text style="fill: #293a38; font: 9px 'DejaVu Sans'; text-anchor: start" x="34.56" y="511.558594" transform="rotate(-0 34.56 511.558594)">Exact two-state model · dots guide the eye, not sampled trajectories · both states communicate and have self-loops</text>
   </g>
   <g id="text_32">
    <text style="fill: #293a38; font: 9px 'DejaVu Sans'; text-anchor: end" x="885.6" y="511.558594" transform="rotate(-0 885.6 511.558594)">ickma.dev</text>
   </g>
  </g>

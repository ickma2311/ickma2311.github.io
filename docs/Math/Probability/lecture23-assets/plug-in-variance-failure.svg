  <g id="text_10">
   <text style="font-weight: 700; font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24312e" x="63.36" y="48.6" transform="rotate(-0 63.36 48.6)">A plug-in variance can collapse the interval</text>
  </g>
  <g id="text_11">
   <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52635d" x="63.36" y="82.944" transform="rotate(-0 63.36 82.944)">Constructed outcome: zero successes in n = 20 i.i.d. Bernoulli trials; true success probability θ = 0.1.</text>
  </g>
  <g id="text_12">
   <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24312e" x="103.68" y="511.92" transform="rotate(-0 103.68 511.92)">Plug-in: [0, 0]       Upper-SD: [−0.219, 0.219]</text>
  </g>
  <g id="text_13">
   <!-- $P_\theta(K=0)=0.9^{20}$ -->
   <g style="fill: #24312e" transform="translate(748.8 181.44)">
    <text>
     <tspan x="0" y="-0.61925" style="font-style: oblique; font-size: 24px; font-family: 'DejaVu Sans'; fill: #24312e">P</tspan>
     <tspan x="34.770703" y="-0.61925" style="font-style: oblique; font-size: 24px; font-family: 'DejaVu Sans'; fill: #24312e">K</tspan>
     <tspan x="14.472656" y="2.980738" style="font-style: oblique; font-size: 16.8px; font-family: 'DejaVu Sans'; fill: #24312e">θ</tspan>
     <tspan x="25.407422" y="-0.61925" style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #24312e">(</tspan>
     <tspan x="55.184766" y="-0.61925" style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #24312e">=</tspan>
     <tspan x="79.969922" y="-0.61925" style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #24312e">0</tspan>
     <tspan x="95.239453" y="-0.61925" style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #24312e">)</tspan>
     <tspan x="109.278516" y="-0.61925" style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #24312e">=</tspan>
     <tspan x="134.063672" y="-0.61925" style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #24312e">0</tspan>
     <tspan x="149.333203" y="-0.61925" style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #24312e">.</tspan>
     <tspan x="156.962109" y="-0.61925" style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #24312e">9</tspan>
     <tspan x="172.461328" y="-10.53125" style="font-size: 16.8px; font-family: 'DejaVu Sans'; fill: #24312e">2</tspan>
     <tspan x="183.15" y="-10.53125" style="font-size: 16.8px; font-family: 'DejaVu Sans'; fill: #24312e">0</tspan>
    </text>
   </g>
  </g>
  <g id="text_14">
   <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24312e" x="748.8" y="239.76" transform="rotate(-0 748.8 239.76)">= 0.1216  (12.16%)</text>
  </g>
  <g id="text_15">
   <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(748.8 317.446875)">Every zero-success sample</text>
   <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(748.8 346.317187)">misses the fixed target θ = 0.1</text>
   <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(748.8 375.046875)">with the plug-in interval.</text>
  </g>
  <g id="text_16">
   <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(748.8 448.122813)">Its coverage is therefore</text>
   <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(748.8 480.363437)">at most about 87.84%.</text>
   <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #24312e" transform="translate(748.8 510.763438)">Other failures can reduce it.</text>
  </g>
  <g id="text_17">
   <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52635d" x="63.36" y="579.96" transform="rotate(-0 63.36 579.96)">Both rows use the normal formula with z = 1.96. A larger SD bound does not make the approximation exact.</text>
  </g>
  <g id="text_18">
   <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52635d" x="63.36" y="609.12" transform="rotate(-0 63.36 609.12)">Analytical example · raw, untruncated intervals shown · no real experiment or empirical measurement.</text>
  </g>
 </g>
